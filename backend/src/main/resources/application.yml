spring:
  application:
    name: lexis-backend
  # Keep bootstrap runnable before Oracle config is introduced.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_COGNITO_ISSUER_URI:}
          jwk-set-uri: ${AWS_COGNITO_JWK_SET_URI:${AWS_COGNITO_ISSUER_URI:}/.well-known/jwks.json}
  mail:
    host: ${SMTP_HOST:apps.smtp.gov.bc.ca}
    port: ${SMTP_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

lexis:
  features:
    prod-rtm-only: ${LEXIS_PROD_RTM_ONLY:false}
  mail:
    from: ${LEXIS_MAIL_FROM:Provincial.Log.Export.Analyst@gov.bc.ca}
  fam:
    admin:
      base-url: ${LEXIS_FAM_ADMIN_BASE_URL:${FAM_ADMIN_BASE_URL:}}
      application-id: ${LEXIS_FAM_APPLICATION_ID:}
  auth:
    cognito:
      userinfo-uri: ${COGNITO_USERINFO_URI:}
    # Mirrors legacy WebADE "industry-roles" behaviour with renamed submitter roles.
    industry-roles: "LEXIS_PROVINCIAL_SUBMITTER,LEXIS_FEDERAL_SUBMITTER"
  authz:
    # Role names match FAM roles exactly; action keys match legacy canPerformAction/grantedAction keys.
    role-actions:
      LEXIS_ADMIN: ["*"]
      LEXIS_READ_ONLY:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "viewFederalApplication"
      LEXIS_APPLICATION_APPROVER:
        - "/applicationsReview"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/applicationRemarks"
        - "/createExemption"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/applicationReport"
        - "/offerReport"
        - "/teacReport"
        - "/exemptionReport"
        - "/permitReport"
        - "/permitLedgerReport"
        - "/transportReport"
        - "/speciesGradeReport"
        - "/feeReport"
        - "/tenureReport"
        - "/approvedExemptionReport"
        - "mofrListing"
        - "approveExemption"
        - "createApplication"
        - "createOffer"
        - "saveExemption"
        - "savePermit"
        - "uploadApplicationSubmission"
      LEXIS_EXEMPTION_APPROVER:
        - "/createExemption"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "approveExemption"
        - "saveExemption"
      LEXIS_PROVINCIAL_SUBMITTER:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "createApplication"
        - "uploadApplicationSubmission"
      LEXIS_FEDERAL_SUBMITTER:
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "uploadApplicationSubmission"
        - "viewFederalApplication"
      LEXIS_DELEGATED_ADMIN: []
