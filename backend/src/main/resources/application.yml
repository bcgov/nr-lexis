spring:
  application:
    name: lexis-backend
  lifecycle:
    timeout-per-shutdown-phase: ${LEXIS_SHUTDOWN_PHASE_TIMEOUT:60s}
  mvc:
    async:
      request-timeout: ${LEXIS_ASYNC_REQUEST_TIMEOUT:5m}
  # Keep bootstrap runnable before Oracle config is introduced.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_COGNITO_ISSUER_URI:}
          jwk-set-uri: ${AWS_COGNITO_JWK_SET_URI:${AWS_COGNITO_ISSUER_URI:}/.well-known/jwks.json}
  mail:
    host: ${SMTP_HOST:apps.smtp.gov.bc.ca}
    port: ${SMTP_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

logging:
  level:
    ca.bc.gov.mof.lexis: ${APP_LOG_LEVEL:INFO}
    ca.bc.gov.mof.lexis.audit.failure: ${LEXIS_FAILURE_DIAGNOSTICS_LOG_LEVEL:INFO}
    ca.bc.gov.mof.lexis.audit.report: ${LEXIS_REPORT_STATISTICS_LOG_LEVEL:INFO}
    ca.bc.gov.mof.lexis.service.report.OracleLexisReportService: ${LEXIS_REPORT_STATISTICS_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

lexis:
  runtime:
    require-oracle-profile: ${LEXIS_REQUIRE_ORACLE_PROFILE:false}
  streaming:
    max-concurrency: ${LEXIS_STREAMING_MAX_CONCURRENCY:16}
  reports:
    artifact-directory: /tmp/lexis-reports
    artifact-cleanup-cron: "0 30 3 * * *"
    artifact-cleanup-zone: America/Vancouver
    artifact-stale-after-minutes: 60
    max-concurrent-generations: ${LEXIS_REPORT_MAX_CONCURRENT_GENERATIONS:6}
    query-timeout-seconds: ${LEXIS_REPORT_QUERY_TIMEOUT_SECONDS:120}
    jdbc-fetch-size: ${LEXIS_REPORT_JDBC_FETCH_SIZE:100}
    virtualizer-directory: ${LEXIS_REPORT_VIRTUALIZER_DIRECTORY:/tmp/lexis-jasper}
    virtualizer-max-pages: ${LEXIS_REPORT_VIRTUALIZER_MAX_PAGES:50}
  expiry:
    enabled: ${LEXIS_EXPIRY_ENABLED:true}
    cron: ${LEXIS_EXPIRY_CRON:30 0 0 * * *}
    zone: ${LEXIS_EXPIRY_ZONE:America/Vancouver}
    lock-at-most-for: ${LEXIS_EXPIRY_LOCK_AT_MOST_FOR:PT6H}
    lock-at-least-for: ${LEXIS_EXPIRY_LOCK_AT_LEAST_FOR:PT5M}
  permit-invoice:
    mode: ${LEXIS_PERMIT_INVOICE_MODE:legacy-best-effort}
    gbms-timeout-seconds: ${LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS:60}
  virus-scan:
    enabled: ${LEXIS_VIRUS_SCAN_ENABLED:false}
    host: ${LEXIS_VIRUS_SCAN_HOST:localhost}
    port: ${LEXIS_VIRUS_SCAN_PORT:3310}
    timeout: ${LEXIS_VIRUS_SCAN_TIMEOUT:10s}
    chunk-size: ${LEXIS_VIRUS_SCAN_CHUNK_SIZE:8192}
  features:
    prod-rtm-only: ${LEXIS_PROD_RTM_ONLY:false}
  mail:
    non-production: ${LEXIS_MAIL_NON_PRODUCTION:true}
    environment: ${LEXIS_MAIL_ENVIRONMENT:non-prod}
    from: ${LEXIS_MAIL_FROM:}
    override-recipients: ${LEXIS_MAIL_OVERRIDE_RECIPIENTS:}
    region-rco-address: ${LEXIS_MAIL_REGION_RCO_ADDRESS:}
    region-rni-address: ${LEXIS_MAIL_REGION_RNI_ADDRESS:}
    region-rsi-address: ${LEXIS_MAIL_REGION_RSI_ADDRESS:}
  auth:
    keycloak:
      # Optional second JWT issuer for machine-to-machine clients such as NEXCOL.
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    # Mirrors legacy WebADE "industry-roles" behaviour with renamed submitter roles.
    industry-roles: "LEXIS_PROVINCIAL_SUBMITTER"
  authz:
    # Role names match FAM roles exactly; action keys match legacy canPerformAction/grantedAction keys.
    # OAuth scopes are for Keycloak machine-to-machine clients and do not grant interactive UI roles.
    scope-actions:
      "[lexis:federal-submission:submit]":
        - "uploadFederalSubmission"
    role-actions:
      LEXIS_ADMIN: ["*"]
      LEXIS_READ_ONLY:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/applicationRemarks"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "viewFederalApplication"
        # Preserve the legacy TEST action metadata. Modern route and API retirement rules
        # independently hide and deny Application, TEAC, Exemption, and Fee report screens.
        - "/applicationReport"
        - "/approvedExemptionReport"
        - "/offerReport"
        - "/teacReport"
        - "/exemptionReport"
        - "/permitReport"
        - "/permitLedgerReport"
        - "/transportReport"
        - "/speciesGradeReport"
        - "/feeReport"
        - "/tenureReport"
        - "mofrListing"
      LEXIS_APPLICATION_APPROVER:
        - "/applicationsReview"
        - "/changeApplicantType"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/applicationRemarks"
        - "/editCompletedApplications"
        - "/createExemption"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/permitsReview"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "viewFederalApplication"
        - "manageFederalApplication"
        - "/offerReport"
        - "/teacReport"
        - "/exemptionReport"
        - "/permitReport"
        - "/permitLedgerReport"
        - "/transportReport"
        - "/speciesGradeReport"
        - "/feeReport"
        - "/tenureReport"
        - "mofrListing"
        - "createApplication"
        - "createOffer"
        - "createPermit"
        # Legacy parity: Application Approvers can save exemptions, including Active OIC/BOIC,
        # but approveExemption remains reserved for Ministerial approval by Exemption Approvers.
        - "saveExemption"
        - "savePermit"
        - "uploadApplicationSubmission"
        - "/fileApplicationUpload"
        - "/fileExemptionUpload"
        - "/filePermitUpload"
        - "/fileInvoiceUpload"
      LEXIS_EXEMPTION_APPROVER:
        # Legacy Exemption Approvers can open linked applications read-only, but cannot create
        # exemptions. Editing an existing exemption remains governed by saveExemption.
        - "/applicationDetails"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "approveExemption"
        - "saveExemption"
      LEXIS_PROVINCIAL_SUBMITTER:
        - "/summary"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/permitReport"
        - "/fileApplicationUpload"
        - "/fileExemptionUpload"
        - "/filePermitUpload"
        - "/fileInvoiceUpload"
        - "createApplication"
        - "createOffer"
        - "createPermit"
        - "savePermit"
        - "uploadApplicationSubmission"
  federal-submission:
    require-request-id: false
    require-user-reference: false
    require-source-system: false
    # Retry guidance returned on dedicated federal endpoint 503 responses.
    retry-after-seconds: 60
