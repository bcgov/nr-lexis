spring:
  application:
    name: lexis-backend
  # Keep bootstrap runnable before Oracle config is introduced.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_COGNITO_ISSUER_URI:}
          jwk-set-uri: ${AWS_COGNITO_JWK_SET_URI:${AWS_COGNITO_ISSUER_URI:}/.well-known/jwks.json}

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

lexis:
  auth:
    cognito:
      enabled: ${LEXIS_COGNITO_ENABLED:false}
      enforce-route-auth: ${LEXIS_ENFORCE_ROUTE_AUTH:false}
    # Mirrors legacy WebADE "industry-roles" behaviour with renamed submitter roles.
    industry-roles: "PROVINCIAL_SUBMITTER,FEDERAL_SUBMITTER"
  authz:
    # Temporary parity scaffold:
    # role names should match FAM roles exactly, and actions should match legacy canPerformAction/grantedAction keys.
    # Replace with finalized matrix as modernization proceeds.
    role-actions:
      ADMIN: ["*"]
      READ_ONLY:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/indianReservePermitSearch"
        - "/indianReservePermitDetails"
        - "mofrListing"
        - "/applicationReport"
        - "/offerReport"
        - "/teacReport"
        - "/exemptionReport"
        - "/permitReport"
        - "/permitLedgerReport"
        - "/transportReport"
        - "/speciesGradeReport"
        - "/feeReport"
        - "/tenureReport"
        - "/approvedExemptionReport"
        - "viewFederalApplication"
        - "viewOICApplication"
      APPLICATION_APPROVER:
        - "/applicationsReview"
        - "/createExemption"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/indianReservePermitSearch"
        - "/indianReservePermitDetails"
