spring:
  application:
    name: lexis-backend
  lifecycle:
    timeout-per-shutdown-phase: ${LEXIS_SHUTDOWN_PHASE_TIMEOUT:60s}
  mvc:
    async:
      request-timeout: ${LEXIS_ASYNC_REQUEST_TIMEOUT:5m}
  task:
    execution:
      # A named email executor suppresses this bean in AUTO mode; MVC streaming needs its own pool.
      mode: force
      thread-name-prefix: lexis-stream-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 8
        keep-alive: 30s
        allow-core-thread-timeout: true
      shutdown:
        await-termination: true
        await-termination-period: 10s
  # Keep bootstrap runnable before Oracle config is introduced.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_COGNITO_ISSUER_URI:}
          jwk-set-uri: ${AWS_COGNITO_JWK_SET_URI:${AWS_COGNITO_ISSUER_URI:}/.well-known/jwks.json}
  mail:
    host: ${SMTP_HOST:apps.smtp.gov.bc.ca}
    port: ${SMTP_PORT:25}
    properties:
      mail:
        smtp:
          auth: false
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

logging:
  level:
    ca.bc.gov.mof.lexis: ${APP_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ca:
  bc:
    gov:
      nrs:
        identity-lookup:
          base-url: ${IDENTITY_LOOKUP_BASE_URL:}

lexis:
  runtime:
    require-oracle-profile: ${LEXIS_REQUIRE_ORACLE_PROFILE:false}
  reports:
    max-concurrent: ${LEXIS_REPORT_MAX_CONCURRENT:1}
    max-output-bytes: ${LEXIS_REPORT_MAX_OUTPUT_BYTES:26214400}
    query-timeout-seconds: ${LEXIS_REPORT_QUERY_TIMEOUT_SECONDS:120}
    virtualizer-directory: ${LEXIS_REPORT_VIRTUALIZER_DIRECTORY:/tmp/lexis-jasper}
    virtualizer-max-pages: ${LEXIS_REPORT_VIRTUALIZER_MAX_PAGES:50}
  expiry:
    enabled: ${LEXIS_EXPIRY_ENABLED:false}
    cron: ${LEXIS_EXPIRY_CRON:30 0 0 * * *}
    zone: ${LEXIS_EXPIRY_ZONE:America/Vancouver}
  permit-invoice:
    mode: ${LEXIS_PERMIT_INVOICE_MODE:legacy-best-effort}
    gbms-timeout-seconds: ${LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS:60}
  virus-scan:
    enabled: ${LEXIS_VIRUS_SCAN_ENABLED:false}
    host: ${LEXIS_VIRUS_SCAN_HOST:localhost}
    port: ${LEXIS_VIRUS_SCAN_PORT:3310}
    timeout: ${LEXIS_VIRUS_SCAN_TIMEOUT:10s}
    chunk-size: ${LEXIS_VIRUS_SCAN_CHUNK_SIZE:8192}
  features:
    prod-rtm-only: ${LEXIS_PROD_RTM_ONLY:false}
  mail:
    enabled: ${LEXIS_MAIL_ENABLED:false}
    non-production: ${LEXIS_MAIL_NON_PRODUCTION:true}
    from: ${LEXIS_MAIL_FROM:Provincial.Log.Export.Analyst@gov.bc.ca}
    override-recipients: ${LEXIS_MAIL_OVERRIDE_RECIPIENTS:}
    region-rco-recipients: ${LEXIS_MAIL_REGION_RCO_RECIPIENTS:}
    region-rni-recipients: ${LEXIS_MAIL_REGION_RNI_RECIPIENTS:}
    region-rsi-recipients: ${LEXIS_MAIL_REGION_RSI_RECIPIENTS:}
    permit-request-recipients: ${LEXIS_MAIL_PERMIT_REQUEST_RECIPIENTS:}
  auth:
    cognito:
      userinfo-uri: ${COGNITO_USERINFO_URI:}
    keycloak:
      # Optional second JWT issuer for machine-to-machine clients such as NEXCOL.
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
    # Mirrors legacy WebADE "industry-roles" behaviour with renamed submitter roles.
    industry-roles: "LEXIS_PROVINCIAL_SUBMITTER"
  authz:
    # Role names match FAM roles exactly; action keys match legacy canPerformAction/grantedAction keys.
    # OAuth scopes are for Keycloak machine-to-machine clients and do not grant interactive UI roles.
    scope-actions:
      "[lexis:federal-submission:submit]":
        - "uploadFederalSubmission"
    role-actions:
      LEXIS_ADMIN: ["*"]
      LEXIS_READ_ONLY:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "viewFederalApplication"
      LEXIS_APPLICATION_APPROVER:
        - "/applicationsReview"
        - "/changeApplicantType"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/applicationRemarks"
        - "/createExemption"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/permitsReview"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "viewFederalApplication"
        - "manageFederalApplication"
        - "/applicationReport"
        - "/offerReport"
        - "/teacReport"
        - "/exemptionReport"
        - "/permitReport"
        - "/permitLedgerReport"
        - "/transportReport"
        - "/speciesGradeReport"
        - "/feeReport"
        - "/tenureReport"
        - "/approvedExemptionReport"
        - "mofrListing"
        - "approveExemption"
        - "createApplication"
        - "createOffer"
        - "createPermit"
        - "saveExemption"
        - "savePermit"
        - "uploadApplicationSubmission"
        - "/fileApplicationUpload"
        - "/fileExemptionUpload"
        - "/filePermitUpload"
        - "/fileInvoiceUpload"
      LEXIS_EXEMPTION_APPROVER:
        - "/createExemption"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "approveExemption"
        - "saveExemption"
      LEXIS_PROVINCIAL_SUBMITTER:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/offersSearch"
        - "/offerDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/fileApplicationUpload"
        - "/fileExemptionUpload"
        - "/filePermitUpload"
        - "/fileInvoiceUpload"
        - "createApplication"
        - "createOffer"
        - "uploadApplicationSubmission"
      LEXIS_DELEGATED_ADMIN: []
  federal-submission:
    # Federal submission creation is disabled by default and must be enabled explicitly.
    create-enabled: false
    require-request-id: false
    require-user-reference: false
    # Compatibility setting; X-Idempotency-Key is always required when CREATE is enabled.
    require-idempotency-key: false
    require-source-system: false
    # Retry guidance returned on dedicated federal endpoint 503 responses.
    retry-after-seconds: 60
