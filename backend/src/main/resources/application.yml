spring:
  application:
    name: lexis-backend
  # Keep bootstrap runnable before Oracle config is introduced.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AWS_COGNITO_ISSUER_URI:}
          jwk-set-uri: ${AWS_COGNITO_JWK_SET_URI:${AWS_COGNITO_ISSUER_URI:}/.well-known/jwks.json}

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

lexis:
  auth:
    cognito:
      enabled: ${LEXIS_COGNITO_ENABLED:false}
      enforce-route-auth: ${LEXIS_ENFORCE_ROUTE_AUTH:false}
    # Mirrors legacy WebADE "industry-roles" configuration.
    industry-roles: "LEXIS_INDUSTRY,LEXIS_LOG_EXPORT_INDUSTRY"
  authz:
    # Temporary parity scaffold:
    # role names should match FAM roles exactly, and actions should match legacy canPerformAction/grantedAction keys.
    # Replace with finalized matrix as modernization proceeds.
    role-actions:
      LEXIS_ADMIN: ["*"]
      LEXIS_READ_ONLY:
        - "/applicationSearch"
        - "/applicationDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/indianReservePermitSearch"
        - "/indianReservePermitDetails"
      LEXIS_APPLICATION_APPROVER:
        - "/applicationsReview"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/indianReservePermitSearch"
        - "/indianReservePermitDetails"
      LEXIS_EXEMPTION_APPROVER:
        - "/exemptionSearch"
        - "/exemptionDetails"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/applicationsReview"
        - "/federalApplicationSearch"
        - "/federalApplicationDetails"
        - "/permitSearch"
        - "/permitDetails"
        - "/indianReservePermitSearch"
        - "/indianReservePermitDetails"
      LEXIS_INDUSTRY:
        - "/summary"
        - "/exemptionSearch"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/offersSearch"
        - "/offerDetails"
      LEXIS_LOG_EXPORT_INDUSTRY:
        - "/summary"
        - "/exemptionSearch"
        - "/applicationSearch"
        - "/applicationDetails"
        - "/offersSearch"
        - "/offerDetails"
