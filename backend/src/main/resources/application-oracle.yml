spring:
  autoconfigure:
    # Re-enable the datasource for the Oracle profile.
    exclude: []

  datasource:
    url: "jdbc:oracle:thin:@(DESCRIPTION=(ADDRESS=(PROTOCOL=TCPS)(HOST=${DATABASE_HOST})(PORT=${DATABASE_PORT:1543}))(CONNECT_DATA=(SERVICE_NAME=${DATABASE_SERVICE_NAME})(SERVER=DEDICATED)))"
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        javax.net.ssl.trustStoreType: JKS
        javax.net.ssl.trustStore: ${TRUSTSTORE_PATH:/cert/jssecacerts}
        javax.net.ssl.trustStorePassword: ${KEYSTORE_SECRET}

management:
  endpoint:
    health:
      group:
        readiness:
          # Every replica shares one Oracle pool per pod and one database. Gating readiness on a
          # pool that long reports can fill would take all replicas out of the Service together.
          # Startup still fails without Oracle (OracleDataSourceConfiguration), and /actuator/health
          # still reports db for monitoring.
          include: readinessState
