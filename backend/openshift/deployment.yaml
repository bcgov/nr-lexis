---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexis-backend
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-backend
spec:
  replicas: ${MIN_REPLICAS}
  selector:
    matchLabels:
      app: lexis-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        app: lexis-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: lexis-backend-init
          image: ghcr.io/bcgov/nr-forest-client/common:prod
          imagePullPolicy: Always
          env:
            - name: ORACLEDB_HOST
              value: ${DATABASE_HOST}
            - name: ORACLEDB_SECRET
              valueFrom:
                secretKeyRef:
                  name: lexis-backend-secret
                  key: KEYSTORE_SECRET
            - name: ORACLEDB_PORT
              value: "1543"
          volumeMounts:
            - name: lexis-backend-api-cert
              mountPath: /cert
            - name: init-tmp-storage
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 300Mi
              ephemeral-storage: "50Mi"
            limits:
              cpu: 500m
              memory: 500Mi
              ephemeral-storage: "100Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: lexis-backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: oracle
            - name: SERVER_PORT
              value: "8080"
            - name: AWS_COGNITO_ISSUER_URI
              value: ${AWS_COGNITO_ISSUER_URI}
            - name: COGNITO_USERINFO_URI
              value: ${COGNITO_USERINFO_URI}
            - name: IDENTITY_LOOKUP_BASE_URL
              value: ${IDENTITY_LOOKUP_BASE_URL}
            - name: DATABASE_HOST
              value: ${DATABASE_HOST}
            - name: DATABASE_SERVICE_NAME
              value: ${DATABASE_SERVICE_NAME}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: lexis-backend-secret
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lexis-backend-secret
                  key: DATABASE_PASSWORD
            - name: APP_LOG_LEVEL
              value: ${APP_LOG_LEVEL}
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
              value: ${SPRING_SECURITY_LOG_LEVEL}
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
              value: ${SPRING_WEB_LOG_LEVEL}
            - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE
              value: ${SPRING_BOOT_AUTOCONFIG_LOG_LEVEL}
            - name: SPRING_JPA_SHOW_SQL
              value: "${SPRING_JPA_SHOW_SQL}"
            - name: KEYSTORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: lexis-backend-secret
                  key: KEYSTORE_SECRET
            - name: LEXIS_VIRUS_SCAN_ENABLED
              value: "true"
            - name: LEXIS_VIRUS_SCAN_HOST
              value: lexis-clamav
            - name: LEXIS_VIRUS_SCAN_PORT
              value: "3310"
            - name: LEXIS_VIRUS_SCAN_TIMEOUT
              value: 10s
          resources:
            requests:
              cpu: ${MIN_CPU}
              memory: ${MIN_MEM}
              ephemeral-storage: "200Mi"
            limits:
              cpu: "1000m"
              memory: "800Mi"
              ephemeral-storage: "500Mi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
            successThreshold: 1
          volumeMounts:
            - name: lexis-backend-api-cert
              mountPath: /cert
            - name: tls-certs
              mountPath: /etc/tls-certs
              readOnly: true
            - name: log-storage
              mountPath: /logs
            - name: app-storage
              mountPath: /temp
            - name: tmp-storage
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tls-certs
          secret:
            secretName: lexis-backend-cert
        - name: log-storage
          emptyDir: {}
        - name: app-storage
          emptyDir: {}
        - name: tmp-storage
          emptyDir: {}
        - name: init-tmp-storage
          emptyDir: {}
        - name: lexis-backend-api-cert
          persistentVolumeClaim:
            claimName: lexis-backend-api-cert
---
apiVersion: v1
kind: Service
metadata:
  name: lexis-backend
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-backend
  annotations:
    service.alpha.openshift.io/serving-cert-secret-name: lexis-backend-cert
spec:
  selector:
    app: lexis-backend
  ports:
    - name: 8080-tcp
      port: 8080
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lexis-backend-cpu-autoscaler
  namespace: ${OC_NAMESPACE}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lexis-backend
  minReplicas: ${MIN_REPLICAS}
  maxReplicas: ${MAX_REPLICAS}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lexis-clamav-config
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-clamav
data:
  clamd.conf: |
    LogFile /dev/stdout
    LogTime yes
    DatabaseDirectory /opt/app-root/src
    TCPSocket 3310
    StreamMaxLength 25M
    ReadTimeout 120
    CommandReadTimeout 10
    SendBufTimeout 500
    MaxThreads 10
    MaxQueue 30
    Foreground yes
    TemporaryDirectory /tmp/clamav
    AllowSupplementaryGroups yes
    ScanArchive yes
    Bytecode yes
  freshclam.conf: |
    DatabaseDirectory /opt/app-root/src
    LogTime yes
    LogVerbose yes
    DatabaseMirror https://clamav-mirror.apps.silver.devops.gov.bc.ca
    Foreground yes
    ConnectTimeout 60
    ReceiveTimeout 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexis-clamav
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-clamav
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lexis-clamav
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lexis-clamav
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: lexis-clamav
          image: ${CLAMAV_IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 3310
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 300Mi
            limits:
              cpu: 1500m
              memory: 2Gi
              ephemeral-storage: 1Gi
          livenessProbe:
            exec:
              command:
                - /opt/app-root/clamdcheck.sh
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /opt/app-root/clamdcheck.sh
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: clamav-config
              mountPath: /usr/local/etc/clamd.conf
              subPath: clamd.conf
              readOnly: true
            - name: clamav-config
              mountPath: /usr/local/etc/freshclam.conf
              subPath: freshclam.conf
              readOnly: true
            - name: clamav-db
              mountPath: /opt/app-root/src
            - name: clamav-logs
              mountPath: /var/log/clamav
            - name: clamav-tmp
              mountPath: /tmp/clamav
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: clamav-config
          configMap:
            name: lexis-clamav-config
        - name: clamav-db
          emptyDir: {}
        - name: clamav-logs
          emptyDir: {}
        - name: clamav-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lexis-clamav
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-clamav
spec:
  selector:
    app: lexis-clamav
  ports:
    - name: 3310-tcp
      port: 3310
      targetPort: 3310
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-backend-to-clamav
  namespace: ${OC_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: lexis-clamav
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lexis-backend
      ports:
        - protocol: TCP
          port: 3310
  policyTypes:
    - Ingress
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  labels:
    app: lexis-backend
  name: lexis-backend-api-cert
  namespace: ${OC_NAMESPACE}
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Mi
  storageClassName: netapp-file-standard
---
apiVersion: v1
kind: Secret
metadata:
  name: lexis-backend-secret
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-backend
type: Opaque
stringData:
  DATABASE_USER: ${DATABASE_USER}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD}
  KEYSTORE_SECRET: ${KEYSTORE_SECRET}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-frontend-and-monitoring-to-backend
  namespace: ${OC_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: lexis-backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lexis-frontend
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: monitoring
  policyTypes:
    - Ingress
