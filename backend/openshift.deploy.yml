---
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-lexis-backend-deploy
parameters:
  - name: NAME
    description: App name prefix
    value: nr-lexis
  - name: ZONE
    description: PR number, 'test', or 'prod'
    required: true
  - name: SLOT
    description: Route hostname slot — PR % 50 for previews, or test/prod
    required: true
  - name: IMAGE_TAG
    description: Container image tag (PR number, 'test', or 'prod')
    value: latest
  - name: ROLLOUT_TRIGGER
    description: Value placed on pod templates to force rollout when a reused image tag is rebuilt
    value: ""
  - name: REGISTRY
    description: Image registry path (no tag)
    value: ghcr.io/bcgov/nr-lexis/backend
  - name: SPRING_PROFILES_ACTIVE
    value: oracle
  - name: MIN_REPLICAS
    value: "1"
  - name: MAX_REPLICAS
    value: "3"
  - name: MIN_CPU
    value: "200m"
  - name: MIN_MEM
    value: "500Mi"
  - name: MAX_CPU
    value: "1000m"
  - name: MAX_MEM
    value: "800Mi"
  - name: APP_LOG_LEVEL
    value: INFO
  - name: LEXIS_REPORT_STATISTICS_LOG_LEVEL
    description: DEBUG exposes successful report statistics; INFO keeps them hidden
    value: INFO
  - name: SPRING_SECURITY_LOG_LEVEL
    value: INFO
  - name: SPRING_WEB_LOG_LEVEL
    value: INFO
  - name: SPRING_BOOT_AUTOCONFIG_LOG_LEVEL
    value: INFO
  - name: SPRING_JPA_SHOW_SQL
    value: "false"
  - name: LEXIS_PROD_RTM_ONLY
    value: "false"
  - name: LEXIS_EXPIRY_ENABLED
    description: Enable the legacy-equivalent daily exemption expiry scheduler
    value: "false"
  - name: LEXIS_EXPIRY_CRON
    description: Daily expiry scheduler cron expression
    value: "30 0 0 * * *"
  - name: LEXIS_EXPIRY_ZONE
    description: Daily expiry scheduler time zone
    value: America/Vancouver
  - name: LEXIS_EXPIRY_LOCK_AT_MOST_FOR
    description: Maximum duration of one Oracle scheduler lock
    value: PT6H
  - name: LEXIS_EXPIRY_LOCK_AT_LEAST_FOR
    description: Minimum duration of one Oracle scheduler lock
    value: PT5M
  - name: LEXIS_REPORT_QUERY_TIMEOUT_SECONDS
    description: Maximum Oracle/Jasper report query duration before cancellation
    value: "120"
  - name: LEXIS_PERMIT_INVOICE_MODE
    description: Permit invoice coordinator; legacy-best-effort preserves the legacy workflow
    value: legacy-best-effort
  - name: LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS
    description: Requested timeout for each isolated GBMS transaction
    value: "60"
  - name: LEXIS_MAIL_NON_PRODUCTION
    description: Allow TEST/DEV interception when override recipients are configured
    value: "true"
  - name: LEXIS_MAIL_ENVIRONMENT
    description: Non-secret deployment environment label used on intercepted messages
    value: non-prod
  - name: LEXIS_MAIL_FROM
    description: Approved sender mailbox supplied by the GitHub Environment
    value: ""
  - name: LEXIS_MAIL_OVERRIDE_RECIPIENTS
    description: Comma- or semicolon-separated TEST/DEV administrator email addresses
    value: ""
  - name: LEXIS_MAIL_REGION_RCO_RECIPIENTS
    description: Externally managed RCO distribution list recipients
    value: ""
  - name: LEXIS_MAIL_REGION_RNI_RECIPIENTS
    description: Externally managed RNI distribution list recipients
    value: ""
  - name: LEXIS_MAIL_REGION_RSI_RECIPIENTS
    description: Externally managed RSI distribution list recipients
    value: ""
  - name: LEXIS_MAIL_PERMIT_REQUEST_RECIPIENTS
    description: Migration fallback for permit review recipients
    value: ""
  - name: AWS_COGNITO_ISSUER_URI
    required: true
  - name: COGNITO_USERINFO_URI
    required: true
  - name: KEYCLOAK_ISSUER_URI
    description: Optional Keycloak realm issuer URI for machine-to-machine service clients
    value: ""
  - name: IDENTITY_LOOKUP_BASE_URL
    required: true
  - name: DATABASE_HOST
    required: true
  - name: DATABASE_SERVICE_NAME
    required: true
  - name: DATABASE_USER
    required: true
  - name: DATABASE_PASSWORD
    required: true
  - name: KEYSTORE_SECRET
    required: true
  - name: LEXIS_VIRUS_SCAN_ENABLED
    value: "true"
  - name: LEXIS_VIRUS_SCAN_HOST
    description: Shared ClamAV service DNS name
    required: true
  - name: LEXIS_VIRUS_SCAN_TIMEOUT
    value: 10s
  - name: DOMAIN
    description: Cluster apps domain (no leading dot)
    value: apps.gold.devops.gov.bc.ca

objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-backend-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/name: ${NAME}-backend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      replicas: ${{MIN_REPLICAS}}
      selector:
        matchLabels:
          app: ${NAME}-backend-${ZONE}
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      template:
        metadata:
          labels:
            app: ${NAME}-backend-${ZONE}
            app.kubernetes.io/name: ${NAME}-backend
            app.kubernetes.io/instance: ${ZONE}
          annotations:
            app.openshift.io/redeploy-token: ${ROLLOUT_TRIGGER}
        spec:
          terminationGracePeriodSeconds: 90
          automountServiceAccountToken: false
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  app: ${NAME}-backend-${ZONE}
          securityContext:
            runAsNonRoot: true
          initContainers:
            - name: ${NAME}-backend-init
              image: ghcr.io/bcgov/nr-forest-client/common:prod
              imagePullPolicy: Always
              env:
                - name: ORACLEDB_HOST
                  value: ${DATABASE_HOST}
                - name: ORACLEDB_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: KEYSTORE_SECRET
                - name: ORACLEDB_PORT
                  value: "1543"
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                - name: init-tmp-storage
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "200m"
                  memory: "300Mi"
                  ephemeral-storage: "50Mi"
                limits:
                  cpu: "500m"
                  memory: "500Mi"
                  ephemeral-storage: "100Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: ${NAME}-backend
              image: ${REGISTRY}:${IMAGE_TAG}
              imagePullPolicy: Always
              ports:
                - containerPort: 8080
                  protocol: TCP
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: ${SPRING_PROFILES_ACTIVE}
                - name: LEXIS_REQUIRE_ORACLE_PROFILE
                  value: "true"
                - name: SERVER_PORT
                  value: "8080"
                - name: HOME
                  value: /tmp
                - name: XDG_CACHE_HOME
                  value: /tmp/.cache
                - name: AWS_COGNITO_ISSUER_URI
                  value: ${AWS_COGNITO_ISSUER_URI}
                - name: COGNITO_USERINFO_URI
                  value: ${COGNITO_USERINFO_URI}
                - name: KEYCLOAK_ISSUER_URI
                  value: ${KEYCLOAK_ISSUER_URI}
                - name: IDENTITY_LOOKUP_BASE_URL
                  value: ${IDENTITY_LOOKUP_BASE_URL}
                - name: DATABASE_HOST
                  value: ${DATABASE_HOST}
                - name: DATABASE_SERVICE_NAME
                  value: ${DATABASE_SERVICE_NAME}
                - name: DATABASE_USER
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: DATABASE_USER
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: DATABASE_PASSWORD
                - name: APP_LOG_LEVEL
                  value: ${APP_LOG_LEVEL}
                - name: LEXIS_REPORT_STATISTICS_LOG_LEVEL
                  value: ${LEXIS_REPORT_STATISTICS_LOG_LEVEL}
                - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
                  value: ${SPRING_SECURITY_LOG_LEVEL}
                - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB
                  value: ${SPRING_WEB_LOG_LEVEL}
                - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BOOT_AUTOCONFIGURE
                  value: ${SPRING_BOOT_AUTOCONFIG_LOG_LEVEL}
                - name: SPRING_JPA_SHOW_SQL
                  value: ${SPRING_JPA_SHOW_SQL}
                - name: LEXIS_PROD_RTM_ONLY
                  value: ${LEXIS_PROD_RTM_ONLY}
                - name: LEXIS_EXPIRY_ENABLED
                  value: ${LEXIS_EXPIRY_ENABLED}
                - name: LEXIS_EXPIRY_CRON
                  value: ${LEXIS_EXPIRY_CRON}
                - name: LEXIS_EXPIRY_ZONE
                  value: ${LEXIS_EXPIRY_ZONE}
                - name: LEXIS_EXPIRY_LOCK_AT_MOST_FOR
                  value: ${LEXIS_EXPIRY_LOCK_AT_MOST_FOR}
                - name: LEXIS_EXPIRY_LOCK_AT_LEAST_FOR
                  value: ${LEXIS_EXPIRY_LOCK_AT_LEAST_FOR}
                - name: LEXIS_REPORT_QUERY_TIMEOUT_SECONDS
                  value: ${LEXIS_REPORT_QUERY_TIMEOUT_SECONDS}
                - name: LEXIS_PERMIT_INVOICE_MODE
                  value: ${LEXIS_PERMIT_INVOICE_MODE}
                - name: LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS
                  value: ${LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS}
                - name: LEXIS_MAIL_NON_PRODUCTION
                  value: ${LEXIS_MAIL_NON_PRODUCTION}
                - name: LEXIS_MAIL_ENVIRONMENT
                  value: ${LEXIS_MAIL_ENVIRONMENT}
                - name: LEXIS_MAIL_FROM
                  value: ${LEXIS_MAIL_FROM}
                - name: LEXIS_MAIL_OVERRIDE_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: LEXIS_MAIL_OVERRIDE_RECIPIENTS
                - name: LEXIS_MAIL_REGION_RCO_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: LEXIS_MAIL_REGION_RCO_RECIPIENTS
                - name: LEXIS_MAIL_REGION_RNI_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: LEXIS_MAIL_REGION_RNI_RECIPIENTS
                - name: LEXIS_MAIL_REGION_RSI_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: LEXIS_MAIL_REGION_RSI_RECIPIENTS
                - name: LEXIS_MAIL_PERMIT_REQUEST_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: LEXIS_MAIL_PERMIT_REQUEST_RECIPIENTS
                - name: KEYSTORE_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ${NAME}-backend-secret-${ZONE}
                      key: KEYSTORE_SECRET
                - name: LEXIS_VIRUS_SCAN_ENABLED
                  value: ${LEXIS_VIRUS_SCAN_ENABLED}
                - name: LEXIS_VIRUS_SCAN_HOST
                  value: ${LEXIS_VIRUS_SCAN_HOST}
                - name: LEXIS_VIRUS_SCAN_PORT
                  value: "3310"
                - name: LEXIS_VIRUS_SCAN_TIMEOUT
                  value: ${LEXIS_VIRUS_SCAN_TIMEOUT}
              resources:
                requests:
                  cpu: ${MIN_CPU}
                  memory: ${MIN_MEM}
                  ephemeral-storage: "512Mi"
                limits:
                  cpu: ${MAX_CPU}
                  memory: ${MAX_MEM}
                  ephemeral-storage: "4Gi"
              startupProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: 8080
                periodSeconds: 5
                timeoutSeconds: 3
                failureThreshold: 60
                successThreshold: 1
              livenessProbe:
                httpGet:
                  path: /actuator/health/liveness
                  port: 8080
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 3
                successThreshold: 1
              readinessProbe:
                httpGet:
                  path: /actuator/health/readiness
                  port: 8080
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 3
                successThreshold: 1
              volumeMounts:
                - name: api-cert
                  mountPath: /cert
                  readOnly: true
                - name: tmp-storage
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp-storage
              emptyDir: {}
            - name: init-tmp-storage
              emptyDir: {}
            - name: api-cert
              persistentVolumeClaim:
                claimName: ${NAME}-backend-api-cert-${ZONE}

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-backend-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-backend-${ZONE}
      ports:
        - name: 8080-tcp
          port: 8080
          protocol: TCP

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${NAME}-backend-api-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      host: ${NAME}-api-${SLOT}.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-backend-${ZONE}
      port:
        targetPort: 8080-tcp
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: ${NAME}-backend-${ZONE}-cpu
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: ${NAME}-backend-${ZONE}
      minReplicas: ${{MIN_REPLICAS}}
      maxReplicas: ${{MAX_REPLICAS}}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
          selectPolicy: Max
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ${NAME}-backend-api-cert-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 50Mi
      storageClassName: netapp-file-standard

  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${NAME}-backend-secret-${ZONE}
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    type: Opaque
    stringData:
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KEYSTORE_SECRET: ${KEYSTORE_SECRET}
      LEXIS_MAIL_OVERRIDE_RECIPIENTS: ${LEXIS_MAIL_OVERRIDE_RECIPIENTS}
      LEXIS_MAIL_REGION_RCO_RECIPIENTS: ${LEXIS_MAIL_REGION_RCO_RECIPIENTS}
      LEXIS_MAIL_REGION_RNI_RECIPIENTS: ${LEXIS_MAIL_REGION_RNI_RECIPIENTS}
      LEXIS_MAIL_REGION_RSI_RECIPIENTS: ${LEXIS_MAIL_REGION_RSI_RECIPIENTS}
      LEXIS_MAIL_PERMIT_REQUEST_RECIPIENTS: ${LEXIS_MAIL_PERMIT_REQUEST_RECIPIENTS}

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-backend-${ZONE}-ingress
      labels:
        app: ${NAME}-backend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-backend-${ZONE}
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app: ${NAME}-frontend-${ZONE}
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: monitoring
      policyTypes:
        - Ingress
