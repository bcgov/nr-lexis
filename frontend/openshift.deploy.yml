---
# Frontend deploy Template — consumed by `oc process` in reusable-deploy.yml.
#
# Runtime VITE_* values are injected into /srv/config.js by docker-entrypoint.sh
# when the container starts, allowing one image to run across dev/test/prod.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: nr-lexis-frontend-deploy
parameters:
  - name: NAME
    description: App name prefix
    value: nr-lexis
  - name: ZONE
    description: PR number, 'test', or 'prod'
    required: true
  - name: SLOT
    description: Route hostname slot — PR % 50 for previews, or test/prod
    required: true
  - name: REPLICAS
    description: Pod count
    value: "2"
  - name: IMAGE_TAG
    description: Container image tag (PR number, 'test', or 'prod')
    value: latest
  - name: REGISTRY
    description: Image registry path (no tag)
    value: ghcr.io/bcgov/nr-lexis/frontend
  - name: DOMAIN
    description: Cluster apps domain (no leading dot)
    value: apps.silver.devops.gov.bc.ca
  - name: FRONTEND_LOG_LEVEL
    value: INFO
  - name: VITE_LOGIN_URL
    value: ""
  - name: VITE_LOGOUT_URL
    value: ""
  - name: VITE_LEXIS_REPORT_ENDPOINT_BASE
    value: /api
  - name: VITE_LEXIS_REPORT_API_BASE
    value: /lexis/reports

objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/name: ${NAME}-frontend
        app.kubernetes.io/instance: ${ZONE}
    spec:
      replicas: ${{REPLICAS}}
      selector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      template:
        metadata:
          labels:
            app: ${NAME}-frontend-${ZONE}
            app.kubernetes.io/instance: ${ZONE}
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
          initContainers:
            - name: seed-srv
              image: ${REGISTRY}:${IMAGE_TAG}
              command:
                - sh
                - -c
                - 'cp -r /srv/. /srv-rw/'
              volumeMounts:
                - name: srv
                  mountPath: /srv-rw
              resources:
                requests:
                  cpu: "20m"
                  memory: "32Mi"
                  ephemeral-storage: "50Mi"
                limits:
                  cpu: "100m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: ${NAME}-frontend
              image: ${REGISTRY}:${IMAGE_TAG}
              ports:
                - name: http
                  containerPort: 3000
                - name: health
                  containerPort: 3001
              env:
                - name: LOG_LEVEL
                  value: ${FRONTEND_LOG_LEVEL}
                - name: BACKEND_URL
                  value: http://${NAME}-backend-${ZONE}:8080
                - name: XDG_DATA_HOME
                  value: /tmp
                - name: XDG_CONFIG_HOME
                  value: /tmp
                - name: VITE_LOGIN_URL
                  value: ${VITE_LOGIN_URL}
                - name: VITE_LOGOUT_URL
                  value: ${VITE_LOGOUT_URL}
                - name: VITE_LEXIS_REPORT_ENDPOINT_BASE
                  value: ${VITE_LEXIS_REPORT_ENDPOINT_BASE}
                - name: VITE_LEXIS_REPORT_API_BASE
                  value: ${VITE_LEXIS_REPORT_API_BASE}
              volumeMounts:
                - name: srv
                  mountPath: /srv
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                  ephemeral-storage: "100Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
                  ephemeral-storage: "200Mi"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 3001
                initialDelaySeconds: 5
                periodSeconds: 10
              readinessProbe:
                httpGet:
                  path: /health
                  port: 3001
                initialDelaySeconds: 3
                periodSeconds: 5
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: srv
              emptyDir: {}
            - name: tmp
              emptyDir: {}

  - apiVersion: v1
    kind: Service
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      selector:
        app: ${NAME}-frontend-${ZONE}
      ports:
        - name: http
          protocol: TCP
          port: 3000
          targetPort: 3000

  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: ${NAME}-frontend-${ZONE}
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      host: ${NAME}-${SLOT}.${DOMAIN}
      to:
        kind: Service
        name: ${NAME}-frontend-${ZONE}
      port:
        targetPort: http
      tls:
        termination: edge
        insecureEdgeTerminationPolicy: Redirect

  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: ${NAME}-frontend-${ZONE}-ingress
      labels:
        app: ${NAME}-frontend-${ZONE}
        app.kubernetes.io/instance: ${ZONE}
    spec:
      podSelector:
        matchLabels:
          app: ${NAME}-frontend-${ZONE}
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  network.openshift.io/policy-group: ingress
      policyTypes:
        - Ingress
