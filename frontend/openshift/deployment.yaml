---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexis-frontend
  namespace: ${OC_NAMESPACE}
  labels:
    app: lexis-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lexis-frontend
  template:
    metadata:
      labels:
        app: lexis-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: seed-srv
          image: ${FRONTEND_IMAGE}
          command:
            - sh
            - -c
            - 'cp -r /srv/. /srv-rw/'
          volumeMounts:
            - name: srv
              mountPath: /srv-rw
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "100Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: lexis-frontend
          image: ${FRONTEND_IMAGE}
          ports:
            - name: http
              containerPort: 3000
            - name: health
              containerPort: 3001
          env:
            - name: LOG_LEVEL
              value: ${FRONTEND_LOG_LEVEL}
            - name: BACKEND_URL
              value: ${BACKEND_URL}
            - name: XDG_DATA_HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp
            - name: VITE_USER_POOLS_ID
              value: ${VITE_USER_POOLS_ID}
            - name: VITE_USER_POOLS_WEB_CLIENT_ID
              value: ${VITE_USER_POOLS_WEB_CLIENT_ID}
            - name: VITE_COGNITO_DOMAIN
              value: ${VITE_COGNITO_DOMAIN}
            - name: VITE_REDIRECT_SIGN_IN
              value: ${VITE_REDIRECT_SIGN_IN}
            - name: VITE_REDIRECT_SIGN_OUT
              value: ${VITE_REDIRECT_SIGN_OUT}
            - name: VITE_COGNITO_SCOPES
              value: ${VITE_COGNITO_SCOPES}
            - name: VITE_ZONE
              value: ${VITE_ZONE}
            - name: VITE_LEXIS_PROD_RTM_ONLY
              value: ${VITE_LEXIS_PROD_RTM_ONLY}
            - name: VITE_FAM_MANAGE_URL
              value: ${VITE_FAM_MANAGE_URL}
            - name: VITE_LEXIS_REPORT_ENDPOINT_BASE
              value: ${VITE_LEXIS_REPORT_ENDPOINT_BASE}
            - name: VITE_LEXIS_REPORT_API_BASE
              value: ${VITE_LEXIS_REPORT_API_BASE}
          volumeMounts:
            - name: srv
              mountPath: /srv
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
              ephemeral-storage: "200Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: srv
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: lexis-frontend
  namespace: ${OC_NAMESPACE}
spec:
  selector:
    app: lexis-frontend
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
# Route
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: lexis-frontend
  namespace: ${OC_NAMESPACE}
spec:
  host: ${FRONTEND_HOST}
  to:
    kind: Service
    name: lexis-frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-openshift-ingress-to-frontend
  namespace: ${OC_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: lexis-frontend
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  policyTypes:
    - Ingress
