# Local-dev Compose for nr-lexis.
#
# Two-service stack: Spring Boot backend (port 8080) + Vite frontend (port
# 3000) + optional Caddy production-image variant (profile `caddy`, port 3005).
# No database service: LEXIS connects to shared Oracle directly.
#
# Prereqs (host machine):
#   1. Network access to the BC Gov Oracle environment is available.
#   2. backend/src/main/resources/application-local.yml exists.
#   3. backend/src/main/resources/cert/jssecacerts exists.
#   4. frontend/.env exists (copy from frontend/.env.example).
#
# Usage:
#   docker compose up
#   docker compose --profile caddy up caddy
#
# Limitations:
#   - Backend has no hot reload by default; restart backend after Java changes.
#   - First `up` downloads Maven dependencies. `maven-cache` persists them.

x-var:
  - &java-image maven:3.9.9-amazoncorretto-21-alpine
  - &node-image node:22-alpine

services:
  backend:
    image: *java-image
    container_name: backend
    working_dir: /app
    entrypoint: sh -c "mvn -DskipTests spring-boot:run"
    environment:
      SPRING_PROFILES_ACTIVE: local,oracle
      TRUSTSTORE_PATH: /app/src/main/resources/cert/jssecacerts
    ports: ["8080:8080"]
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  frontend:
    image: *node-image
    container_name: frontend
    working_dir: /app
    entrypoint: sh -c "npm ci --ignore-scripts && npm run dev"
    environment:
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 3000
      VITE_DEV_BACKEND_TARGET: http://backend:8080
      VITE_HMR_HOST: localhost
      VITE_HMR_PORT: 3000
      VITE_HMR_PROTOCOL: ws
      NODE_ENV: development
    ports: ["3000:3000"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    container_name: caddy
    profiles: ["caddy"]
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      LOG_LEVEL: info
      PORT: 3000
      NODE_ENV: development
    ports: ["3005:3000"]
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  maven-cache:
