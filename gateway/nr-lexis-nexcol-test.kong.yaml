_format_version: "3.0"
services:
  - name: nr-lexis-nexcol-test
    tags:
      - ns.gw-lexis-nexcol
    host: nr-lexis-backend-test.da5fad-test.svc
    port: 8080
    protocol: http
    retries: 0
    routes:
      - name: nr-lexis-nexcol-federal-submissions-test
        tags:
          - ns.gw-lexis-nexcol
        hosts:
          - nr-lexis-nexcol.test.api.gov.bc.ca
        paths:
          - /api/lexis/federal/submissions
          - /api/lexis/federal/submissions/validation
          - /api/lexis/federal/submissions/prevalidation
        methods:
          - POST
        strip_path: false
        https_redirect_status_code: 426
        path_handling: v0
        request_buffering: true
        response_buffering: true
    plugins:
      - name: jwt-keycloak
        tags:
          - ns.gw-lexis-nexcol
        enabled: true
        config:
          allowed_iss:
            - https://test.loginproxy.gov.bc.ca/auth/realms/forests
          allowed_aud: null
          run_on_preflight: true
          iss_key_grace_period: 10
          maximum_expiration: 0
          algorithm: RS256
          claims_to_verify:
            - exp
          uri_param_names: []
          cookie_names: []
          scope:
            - lexis:federal-submission:submit
          roles: null
          realm_roles: null
          client_roles: null
          anonymous: null
          consumer_match: false
          consumer_match_claim: azp
          consumer_match_claim_custom_id: true
          consumer_match_ignore_not_found: false
      - name: request-transformer
        tags:
          - ns.gw-lexis-nexcol
        enabled: true
        config:
          http_method: null
      - name: cors
        tags:
          - ns.gw-lexis-nexcol
        enabled: true
        config:
          origins:
            - https://openapi.apps.gov.bc.ca
          methods:
            - POST
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Idempotency-Key
            - X-Request-ID
            - X-Source-System
          exposed_headers:
            - Location
            - Retry-After
          credentials: false
          max_age: 3600
          preflight_continue: false
  - name: nr-lexis-nexcol-test-swagger-cors
    tags:
      - ns.gw-lexis-nexcol
    host: nr-lexis-backend-test.da5fad-test.svc
    port: 8080
    protocol: http
    retries: 0
    routes:
      - name: nr-lexis-nexcol-test-swagger-cors
        tags:
          - ns.gw-lexis-nexcol
        hosts:
          - nr-lexis-nexcol-test.api.gov.bc.ca
        paths:
          - /api/lexis/federal/submissions/validation
          - /api/lexis/federal/submissions/prevalidation
          - /api/lexis/federal/submissions
        methods:
          - OPTIONS
        strip_path: false
        https_redirect_status_code: 426
        path_handling: v0
        request_buffering: true
        response_buffering: true
    plugins:
      - name: cors
        tags:
          - ns.gw-lexis-nexcol
        enabled: true
        config:
          origins:
            - https://openapi.apps.gov.bc.ca
          methods:
            - POST
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Idempotency-Key
            - X-Request-ID
            - X-Source-System
          exposed_headers:
            - Location
            - Retry-After
          credentials: false
          max_age: 3600
          preflight_continue: false
