kind: GatewayService
name: nr-lexis-nexcol-dev
tags: [ns.__GATEWAY_ID__]
host: __LEXIS_DEV_BACKEND_ROUTE_HOST__
port: 443
protocol: https
retries: 0
routes:
  - name: nr-lexis-nexcol-federal-submissions-dev
    tags: [ns.__GATEWAY_ID__]
    hosts:
      - __DEV_GATEWAY_HOST__
    paths:
      - /api/lexis/federal/submissions
      - /api/lexis/federal/submissions/validation
    methods:
      - POST
    strip_path: false
    https_redirect_status_code: 426
    path_handling: v0
    request_buffering: true
    response_buffering: true
plugins:
  - name: jwt-keycloak
    tags: [ns.__GATEWAY_ID__]
    enabled: true
    config:
      allowed_iss:
        - __DEV_APIGW_ISSUER_URI__
      allowed_aud: __DEV_APIGW_ALLOWED_AUD__
      run_on_preflight: true
      iss_key_grace_period: 10
      maximum_expiration: 0
      algorithm: RS256
      claims_to_verify:
        - exp
      uri_param_names:
        - jwt
      cookie_names: []
      scope: null
      roles: null
      realm_roles: null
      client_roles:
        - lexis:federal-submission:submit
      anonymous: null
      consumer_match: true
      consumer_match_claim: azp
      consumer_match_claim_custom_id: true
      consumer_match_ignore_not_found: false
  - name: request-transformer
    tags: [ns.__GATEWAY_ID__]
    enabled: true
    config:
      http_method: null
