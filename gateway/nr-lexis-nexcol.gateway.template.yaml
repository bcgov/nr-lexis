---
kind: CredentialIssuer
name: __GATEWAY_ID__ default
description: Default Authorization Profile for the LEXIS NEXCOL gateway
flow: client-credentials
mode: auto
authPlugin: jwt-keycloak
clientAuthenticator: client-secret
clientRoles:
  - lexis:federal-submission:submit
inheritFrom: Gold Shared IdP
---
kind: DraftDataset
name: nr-lexis-nexcol-dataset
title: NR LEXIS NEXCOL Federal Submission API
organization: ministry-of-forests
organizationUnit: forest-tenures
notes: Machine-to-machine validation and submission endpoints for NEXCOL federal LEXIS XML.
tags: [nr-lexis, nexcol, federal-submission]
license_title: Access Only
view_audience: Government
security_class: PROTECTED A
record_publish_date: '2026-07-08'
---
kind: Product
name: NR LEXIS NEXCOL Federal Submission API
dataset: nr-lexis-nexcol-dataset
environments:
  - name: dev
    active: false
    approval: false
    flow: client-credentials
    credentialIssuer: __GATEWAY_ID__ default
    services: [nr-lexis-nexcol-dev]
  - name: test
    active: false
    approval: false
    flow: client-credentials
    credentialIssuer: __GATEWAY_ID__ default
    services: [nr-lexis-nexcol-test]
  - name: prod
    active: false
    approval: true
    flow: client-credentials
    credentialIssuer: __GATEWAY_ID__ default
    services: [nr-lexis-nexcol-prod]
