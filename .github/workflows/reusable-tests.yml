name: Reusable Tests

on:
  workflow_call:
    inputs:
      target:
        description: PR number, 'test' or 'prod'
        default: ${{ github.event.number }}
        type: string
      slot:
        description: |
          Route hostname slot. For PR previews this is PR % 50; for TEST/PROD
          it defaults to target.
        default: ""
        type: string

env:
  DOMAIN: apps.gold.devops.gov.bc.ca
  PREFIX: ${{ github.event.repository.name }}-${{ inputs.slot || inputs.target }}
  BACKEND_PREFIX: ${{ github.event.repository.name }}-api-${{ inputs.slot || inputs.target }}

permissions: {}

jobs:
  e2e-tests:
    name: Basic E2E (${{ matrix.project }})
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.project }}

      - name: Wait for deployed frontend
        env:
          E2E_BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
        run: bash ../.github/scripts/wait-for-frontend.sh "$E2E_BASE_URL" 17 5 '<div id="root"' 30

      - name: Verify live backend readiness and frontend proxy
        env:
          BACKEND_BASE_URL: https://${{ env.BACKEND_PREFIX }}.${{ env.DOMAIN }}
          E2E_BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
        run: |
          set -euo pipefail

          readiness_status=""
          for attempt in $(seq 1 24); do
            readiness_status="$(curl --silent --show-error \
              --output "${RUNNER_TEMP}/lexis-readiness.json" \
              --write-out '%{http_code}' \
              --connect-timeout 5 \
              --max-time 15 \
              "${BACKEND_BASE_URL}/actuator/health/readiness" || true)"
            if [ "${readiness_status}" = "200" ]; then
              break
            fi
            echo "Backend readiness is not available yet (attempt ${attempt}/24, status ${readiness_status:-none})."
            if [ "${attempt}" -lt 24 ]; then
              sleep 5
            fi
          done

          if [ "${readiness_status}" != "200" ]; then
            echo "Expected backend readiness HTTP 200; received ${readiness_status:-none}."
            exit 1
          fi

          capabilities_status="$(curl --silent --show-error \
            --output "${RUNNER_TEMP}/lexis-capabilities.json" \
            --write-out '%{http_code}' \
            --connect-timeout 5 \
            --max-time 30 \
            "${E2E_BASE_URL}/api/lexis/session/capabilities" || true)"
          if [ "${capabilities_status}" != "401" ]; then
            echo "Expected unauthenticated frontend-proxied capabilities HTTP 401; received ${capabilities_status:-none}."
            exit 1
          fi

      - name: Run basic Playwright smoke suite
        env:
          E2E_BASE_URL: https://${{ env.PREFIX }}.${{ env.DOMAIN }}
          CI: "true"
        run: |
          npm run e2e -- --reporter=html,list

      - uses: actions/upload-artifact@v7
        if: (! cancelled())
        with:
          name: playwright-report-${{ matrix.project }}-${{ inputs.target }}
          path: frontend/playwright-report
          retention-days: 7
