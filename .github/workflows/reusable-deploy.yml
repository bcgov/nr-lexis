name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment (e.g. dev, test, prod)
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, 'test' or 'prod'
        default: ${{ github.event.number }}
        type: string
      slot:
        description: |
          Route hostname slot — PR # mod-50'd into a fixed pool for callback
          URLs. Omit for TEST/PROD; defaults to target.
        default: ""
        type: string
      backend_replicas:
        description: Backend replica count (also HPA min/max)
        default: "1"
        type: string
      frontend_replicas:
        description: Frontend replica count
        default: "2"
        type: string
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment (paths that must change)
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      database_user:
        description: Oracle DATABASE_USER
        required: true
      database_password:
        description: Oracle DATABASE_PASSWORD
        required: true
      database_host:
        description: Oracle host
        required: true
      database_service_name:
        description: Oracle service name
        required: true
      keystore_secret:
        description: Oracle keystore passphrase
        required: true
      lexis_prod_rtm_only:
        description: Enables PROD RTM-only feature restriction when set to true
        required: false
      keycloak_sa_client_id:
        description: Keycloak service-account client id used to provision LEXIS clients/scopes
        required: false
      keycloak_sa_client_secret:
        description: Keycloak service-account client secret used to provision LEXIS clients/scopes
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.frontend.outputs.triggered }}

permissions: {}

jobs:
  backend:
    name: Deploy (backend)
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    env:
      DATABASE_HOST: ${{ secrets.database_host }}
      DATABASE_SERVICE_NAME: ${{ secrets.database_service_name }}
      DATABASE_USER: ${{ secrets.database_user }}
      DATABASE_PASSWORD: ${{ secrets.database_password }}
      KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
      KC_SA_CLIENT_ID: ${{ secrets.keycloak_sa_client_id }}
      LEXIS_PROD_RTM_ONLY: ${{ secrets.lexis_prod_rtm_only || 'false' }}
    steps:
      - uses: actions/checkout@v6

      # DEV deployments are ephemeral PR previews; gateway client provisioning is TEST/PROD-only.
      - name: Ensure Keycloak scopes and NEXCOL client
        if: ${{ inputs.environment != 'dev' && env.KC_SA_CLIENT_ID != '' }}
        env:
          KEYCLOAK_ISSUER_URI: ${{ vars.KEYCLOAK_ISSUER_URI }}
          KC_SA_CLIENT_SECRET: ${{ secrets.keycloak_sa_client_secret }}
          NEXCOL_KEYCLOAK_CLIENT_ID: ${{ vars.NEXCOL_KEYCLOAK_CLIENT_ID }}
        run: ./.github/scripts/ensure-keycloak-scopes.sh

      - uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        id: deploy
        with:
          file: backend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p SLOT="${{ inputs.slot || inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p MIN_REPLICAS="${{ inputs.backend_replicas }}"
            -p MAX_REPLICAS="${{ inputs.backend_replicas }}"
            -p AWS_COGNITO_ISSUER_URI="${{ vars.AWS_COGNITO_ISSUER_URI }}"
            -p COGNITO_USERINFO_URI="${{ vars.COGNITO_USERINFO_URI }}"
            -p KEYCLOAK_ISSUER_URI="${{ vars.KEYCLOAK_ISSUER_URI }}"
            -p IDENTITY_LOOKUP_BASE_URL="${{ vars.IDENTITY_LOOKUP_BASE_URL }}"
            -p DATABASE_HOST="$DATABASE_HOST"
            -p DATABASE_SERVICE_NAME="$DATABASE_SERVICE_NAME"
            -p DATABASE_USER="$DATABASE_USER"
            -p DATABASE_PASSWORD="$DATABASE_PASSWORD"
            -p KEYSTORE_SECRET="$KEYSTORE_SECRET"
            -p CLAMAV_REGISTRY="ghcr.io/${{ github.repository }}/clamav"
            -p CLAMAV_IMAGE_TAG="${{ inputs.tag }}"
            -p LEXIS_PROD_RTM_ONLY="$LEXIS_PROD_RTM_ONLY"
          triggers: ${{ inputs.triggers }}

  frontend:
    name: Deploy (frontend)
    environment: ${{ inputs.environment }}
    needs: [backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    env:
      LEXIS_PROD_RTM_ONLY: ${{ secrets.lexis_prod_rtm_only || 'false' }}
    steps:
      - uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        id: deploy
        with:
          file: frontend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p SLOT="${{ inputs.slot || inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p ROLLOUT_TRIGGER="${{ github.sha }}"
            -p REPLICAS="${{ inputs.frontend_replicas }}"
            -p VITE_USER_POOLS_ID="${{ vars.VITE_USER_POOLS_ID }}"
            -p VITE_USER_POOLS_WEB_CLIENT_ID="${{ vars.VITE_USER_POOLS_WEB_CLIENT_ID }}"
            -p VITE_COGNITO_DOMAIN="${{ vars.VITE_COGNITO_DOMAIN }}"
            -p VITE_REDIRECT_SIGN_IN="${{ vars.VITE_REDIRECT_SIGN_IN }}"
            -p VITE_REDIRECT_SIGN_OUT="${{ vars.VITE_REDIRECT_SIGN_OUT }}"
            -p VITE_COGNITO_SCOPES="${{ vars.VITE_COGNITO_SCOPES }}"
            -p VITE_ZONE="${{ vars.VITE_ZONE }}"
            -p VITE_LEXIS_PROD_RTM_ONLY="$LEXIS_PROD_RTM_ONLY"
            -p VITE_FAM_MANAGE_URL="${{ vars.VITE_FAM_MANAGE_URL }}"
            -p VITE_LEXIS_REPORT_ENDPOINT_BASE="${{ vars.VITE_LEXIS_REPORT_ENDPOINT_BASE }}"
            -p VITE_LEXIS_REPORT_API_BASE="${{ vars.VITE_LEXIS_REPORT_API_BASE }}"
          triggers: ${{ inputs.triggers }}
