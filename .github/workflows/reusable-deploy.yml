name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub/OpenShift environment (e.g. dev, test, prod)
        default: ""
        type: string
      target:
        description: Deployment target; usually PR number, 'test' or 'prod'
        default: ${{ github.event.number }}
        type: string
      slot:
        description: |
          Route hostname slot — PR # mod-50'd into a fixed pool for callback
          URLs. Omit for TEST/PROD; defaults to target.
        default: ""
        type: string
      backend_min_replicas:
        description: Minimum backend replica count
        default: "1"
        type: string
      backend_max_replicas:
        description: Maximum backend replica count used by the HPA
        default: "3"
        type: string
      frontend_replicas:
        description: Frontend replica count
        default: "2"
        type: string
      backend_cpu_request:
        description: Backend CPU request
        default: "200m"
        type: string
      backend_memory_request:
        description: Backend memory request
        default: "500Mi"
        type: string
      backend_cpu_limit:
        description: Backend CPU limit
        default: "1000m"
        type: string
      backend_memory_limit:
        description: Backend memory limit
        default: "800Mi"
        type: string
      frontend_cpu_request:
        description: Frontend CPU request
        default: "50m"
        type: string
      frontend_memory_request:
        description: Frontend memory request
        default: "64Mi"
        type: string
      frontend_cpu_limit:
        description: Frontend CPU limit
        default: "200m"
        type: string
      frontend_memory_limit:
        description: Frontend memory limit
        default: "128Mi"
        type: string
      expiry_enabled:
        description: Enable exemption expiry; false is an explicit operational kill switch
        default: true
        type: boolean
      tag:
        description: Container tag
        default: ${{ github.event.number }}
        type: string
      triggers:
        description: Triggers for deployment (paths that must change)
        default: ""
        type: string

    secrets:
      oc_namespace:
        description: OpenShift namespace
        required: true
      clamav_namespace:
        description: Shared ClamAV OpenShift namespace
        required: true
      oc_token:
        description: OpenShift token
        required: true
      database_user:
        description: Oracle DATABASE_USER
        required: true
      database_password:
        description: Oracle DATABASE_PASSWORD
        required: true
      database_host:
        description: Oracle host
        required: true
      database_service_name:
        description: Oracle service name
        required: true
      keystore_secret:
        description: Oracle keystore passphrase
        required: true
      lexis_prod_rtm_only:
        description: Restricts admins to RTM AMV, preserves read-only users, and disables expiry
        required: false
      keycloak_sa_client_id:
        description: Keycloak service-account client id used to provision LEXIS clients/scopes
        required: false
      keycloak_sa_client_secret:
        description: Keycloak service-account client secret used to provision LEXIS clients/scopes
        required: false
      lexis_mail_override_recipients:
        description: Non-production recipient override
        required: false
      lexis_mail_from:
        description: Provincial Log Export Analyst positional mailbox
        required: true
      lexis_mail_region_rco_address:
        description: RCO positional mailbox
        required: true
      lexis_mail_region_rni_address:
        description: RNI positional mailbox
        required: true
      lexis_mail_region_rsi_address:
        description: RSI positional mailbox
        required: true
      vanity_tls_certificate:
        description: PEM leaf certificate for the required PROD vanity Route
        required: false
      vanity_tls_key:
        description: PEM private key matching the PROD vanity certificate
        required: false
      vanity_tls_ca_certificate:
        description: PEM intermediate and root chain for the PROD vanity certificate
        required: false

    outputs:
      triggered:
        description: Has deployment been triggered?
        value: ${{ jobs.frontend.outputs.triggered }}

permissions: {}

jobs:
  backend:
    name: Deploy (backend)
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    steps:
      - uses: actions/checkout@v6

      # DEV deployments are ephemeral PR previews; gateway client provisioning is TEST/PROD-only.
      - name: Ensure Keycloak scopes and NEXCOL client
        if: ${{ inputs.environment != 'dev' }}
        env:
          KEYCLOAK_ISSUER_URI: ${{ vars.KEYCLOAK_ISSUER_URI }}
          KC_SA_CLIENT_ID: ${{ secrets.keycloak_sa_client_id }}
          KC_SA_CLIENT_SECRET: ${{ secrets.keycloak_sa_client_secret }}
          NEXCOL_KEYCLOAK_CLIENT_ID: ${{ vars.NEXCOL_KEYCLOAK_CLIENT_ID }}
        run: bash ./.github/scripts/ensure-keycloak-scopes.sh

      - uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        id: deploy
        env:
          DATABASE_HOST: ${{ secrets.database_host }}
          DATABASE_SERVICE_NAME: ${{ secrets.database_service_name }}
          DATABASE_USER: ${{ secrets.database_user }}
          DATABASE_PASSWORD: ${{ secrets.database_password }}
          KEYSTORE_SECRET: ${{ secrets.keystore_secret }}
          LEXIS_PROD_RTM_ONLY: ${{ secrets.lexis_prod_rtm_only || 'false' }}
          LEXIS_EXPIRY_ENABLED: ${{ inputs.expiry_enabled && secrets.lexis_prod_rtm_only != 'true' && 'true' || 'false' }}
          LEXIS_EXPIRY_CRON: ${{ vars.LEXIS_EXPIRY_CRON || '30 0 0 * * *' }}
          LEXIS_EXPIRY_ZONE: ${{ vars.LEXIS_EXPIRY_ZONE || 'America/Vancouver' }}
          LEXIS_EXPIRY_LOCK_AT_MOST_FOR: ${{ vars.LEXIS_EXPIRY_LOCK_AT_MOST_FOR || 'PT6H' }}
          LEXIS_EXPIRY_LOCK_AT_LEAST_FOR: ${{ vars.LEXIS_EXPIRY_LOCK_AT_LEAST_FOR || 'PT5M' }}
          LEXIS_REPORT_QUERY_TIMEOUT_SECONDS: ${{ vars.LEXIS_REPORT_QUERY_TIMEOUT_SECONDS || '120' }}
          LEXIS_REPORT_JDBC_FETCH_SIZE: ${{ vars.LEXIS_REPORT_JDBC_FETCH_SIZE || '100' }}
          LEXIS_STREAMING_MAX_CONCURRENCY: ${{ vars.LEXIS_STREAMING_MAX_CONCURRENCY || '16' }}
          LEXIS_REPORT_STATISTICS_LOG_LEVEL: ${{ (inputs.environment == 'dev' || inputs.environment == 'test') && 'DEBUG' || 'INFO' }}
          LEXIS_FAILURE_DIAGNOSTICS_LOG_LEVEL: ${{ (inputs.environment == 'dev' || inputs.environment == 'test') && 'DEBUG' || 'INFO' }}
          LEXIS_PERMIT_INVOICE_MODE: ${{ vars.LEXIS_PERMIT_INVOICE_MODE || 'legacy-best-effort' }}
          LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS: ${{ vars.LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS || '60' }}
          LEXIS_MAIL_NON_PRODUCTION: ${{ inputs.environment == 'prod' && 'false' || 'true' }}
          LEXIS_MAIL_ENVIRONMENT: ${{ inputs.environment }}
          LEXIS_MAIL_FROM: ${{ secrets.lexis_mail_from }}
          LEXIS_MAIL_OVERRIDE_RECIPIENTS: ${{ secrets.lexis_mail_override_recipients }}
          LEXIS_MAIL_REGION_RCO_ADDRESS: ${{ secrets.lexis_mail_region_rco_address }}
          LEXIS_MAIL_REGION_RNI_ADDRESS: ${{ secrets.lexis_mail_region_rni_address }}
          LEXIS_MAIL_REGION_RSI_ADDRESS: ${{ secrets.lexis_mail_region_rsi_address }}
        with:
          file: backend/openshift.deploy.yml
          # PR lite mode produces an invalid strategy for this RollingUpdate deployment.
          lite_mode: false
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p ROLLOUT_TRIGGER="${{ github.run_id }}-${{ github.run_attempt }}"
            -p MIN_REPLICAS="${{ inputs.backend_min_replicas }}"
            -p MAX_REPLICAS="${{ inputs.backend_max_replicas }}"
            -p MIN_CPU="${{ inputs.backend_cpu_request }}"
            -p MIN_MEM="${{ inputs.backend_memory_request }}"
            -p MAX_CPU="${{ inputs.backend_cpu_limit }}"
            -p MAX_MEM="${{ inputs.backend_memory_limit }}"
            -p AWS_COGNITO_ISSUER_URI="${{ vars.AWS_COGNITO_ISSUER_URI }}"
            -p KEYCLOAK_ISSUER_URI="${{ vars.KEYCLOAK_ISSUER_URI }}"
            -p ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS || 'https://openapi.apps.gov.bc.ca' }}"
            -p DATABASE_HOST="$DATABASE_HOST"
            -p DATABASE_SERVICE_NAME="$DATABASE_SERVICE_NAME"
            -p DATABASE_USER="$DATABASE_USER"
            -p DATABASE_PASSWORD="$DATABASE_PASSWORD"
            -p KEYSTORE_SECRET="$KEYSTORE_SECRET"
            -p LEXIS_VIRUS_SCAN_HOST="clamav.${{ secrets.clamav_namespace }}.svc"
            -p LEXIS_PROD_RTM_ONLY="$LEXIS_PROD_RTM_ONLY"
            -p LEXIS_EXPIRY_ENABLED="$LEXIS_EXPIRY_ENABLED"
            -p LEXIS_EXPIRY_CRON="$LEXIS_EXPIRY_CRON"
            -p LEXIS_EXPIRY_ZONE="$LEXIS_EXPIRY_ZONE"
            -p LEXIS_EXPIRY_LOCK_AT_MOST_FOR="$LEXIS_EXPIRY_LOCK_AT_MOST_FOR"
            -p LEXIS_EXPIRY_LOCK_AT_LEAST_FOR="$LEXIS_EXPIRY_LOCK_AT_LEAST_FOR"
            -p LEXIS_REPORT_QUERY_TIMEOUT_SECONDS="$LEXIS_REPORT_QUERY_TIMEOUT_SECONDS"
            -p LEXIS_REPORT_JDBC_FETCH_SIZE="$LEXIS_REPORT_JDBC_FETCH_SIZE"
            -p LEXIS_STREAMING_MAX_CONCURRENCY="$LEXIS_STREAMING_MAX_CONCURRENCY"
            -p LEXIS_REPORT_STATISTICS_LOG_LEVEL="$LEXIS_REPORT_STATISTICS_LOG_LEVEL"
            -p LEXIS_FAILURE_DIAGNOSTICS_LOG_LEVEL="$LEXIS_FAILURE_DIAGNOSTICS_LOG_LEVEL"
            -p LEXIS_PERMIT_INVOICE_MODE="$LEXIS_PERMIT_INVOICE_MODE"
            -p LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS="$LEXIS_PERMIT_INVOICE_GBMS_TIMEOUT_SECONDS"
            -p LEXIS_MAIL_NON_PRODUCTION="$LEXIS_MAIL_NON_PRODUCTION"
            -p LEXIS_MAIL_ENVIRONMENT="$LEXIS_MAIL_ENVIRONMENT"
            -p LEXIS_MAIL_FROM="$LEXIS_MAIL_FROM"
            -p LEXIS_MAIL_OVERRIDE_RECIPIENTS="$LEXIS_MAIL_OVERRIDE_RECIPIENTS"
            -p LEXIS_MAIL_REGION_RCO_ADDRESS="$LEXIS_MAIL_REGION_RCO_ADDRESS"
            -p LEXIS_MAIL_REGION_RNI_ADDRESS="$LEXIS_MAIL_REGION_RNI_ADDRESS"
            -p LEXIS_MAIL_REGION_RSI_ADDRESS="$LEXIS_MAIL_REGION_RSI_ADDRESS"
          triggers: ${{ inputs.triggers }}

  frontend:
    name: Deploy (frontend)
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    needs: [backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.deploy.outputs.triggered }}
    env:
      VANITY_HOST: ${{ vars.VANITY_HOST }}
    steps:
      - name: Validate PROD vanity Route configuration
        if: ${{ inputs.target == 'prod' }}
        env:
          VANITY_TLS_CERTIFICATE: ${{ secrets.vanity_tls_certificate }}
          VANITY_TLS_KEY: ${{ secrets.vanity_tls_key }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.vanity_tls_ca_certificate }}
        run: |
          set -euo pipefail
          for setting in VANITY_HOST VANITY_TLS_CERTIFICATE VANITY_TLS_KEY VANITY_TLS_CA_CERTIFICATE; do
            if [ -z "${!setting}" ]; then
              echo "::error title=Missing PROD vanity Route configuration::${setting} must be configured in the PROD GitHub Environment."
              exit 1
            fi
          done

      - name: Resolve frontend logout URL
        env:
          CONFIGURED_SIGN_OUT: ${{ vars.VITE_REDIRECT_SIGN_OUT }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          LEXIS_SLOT: ${{ inputs.slot || inputs.target }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ "${DEPLOY_ENVIRONMENT}" = "dev" ]; then
            if [[ ! "${LEXIS_SLOT}" =~ ^([0-9]|[1-4][0-9])$ ]]; then
              echo "::error title=Invalid DEV logout slot::Expected a Cognito slot from 0 through 49."
              exit 1
            fi
            sign_out="https://${REPOSITORY_NAME}-${LEXIS_SLOT}.apps.gold.devops.gov.bc.ca"
          else
            sign_out="${CONFIGURED_SIGN_OUT}"
          fi
          if [ -z "${sign_out}" ]; then
            echo "::error title=Missing logout URL::VITE_REDIRECT_SIGN_OUT is required outside DEV."
            exit 1
          fi
          printf 'VITE_REDIRECT_SIGN_OUT=%s\n' "${sign_out}" >> "${GITHUB_ENV}"

      - uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        id: deploy
        env:
          LEXIS_PROD_RTM_ONLY: ${{ secrets.lexis_prod_rtm_only || 'false' }}
        with:
          file: frontend/openshift.deploy.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p ZONE="${{ inputs.target }}"
            -p NAME="${{ github.event.repository.name }}"
            -p IMAGE_TAG="${{ inputs.tag }}"
            -p ROLLOUT_TRIGGER="${{ github.run_id }}-${{ github.run_attempt }}"
            -p REPLICAS="${{ inputs.frontend_replicas }}"
            -p MIN_CPU="${{ inputs.frontend_cpu_request }}"
            -p MIN_MEM="${{ inputs.frontend_memory_request }}"
            -p MAX_CPU="${{ inputs.frontend_cpu_limit }}"
            -p MAX_MEM="${{ inputs.frontend_memory_limit }}"
            -p VITE_USER_POOLS_ID="${{ vars.VITE_USER_POOLS_ID }}"
            -p VITE_USER_POOLS_WEB_CLIENT_ID="${{ vars.VITE_USER_POOLS_WEB_CLIENT_ID }}"
            -p VITE_COGNITO_DOMAIN="${{ vars.VITE_COGNITO_DOMAIN }}"
            -p VITE_REDIRECT_SIGN_IN="${{ vars.VITE_REDIRECT_SIGN_IN }}"
            -p VITE_REDIRECT_SIGN_OUT="$VITE_REDIRECT_SIGN_OUT"
            -p VITE_LOGOUT_SITEMINDER_URL="${{ vars.VITE_LOGOUT_SITEMINDER_URL }}"
            -p VITE_LOGOUT_KEYCLOAK_URL="${{ vars.VITE_LOGOUT_KEYCLOAK_URL }}"
            -p VITE_LOGOUT_KEYCLOAK_CLIENT_ID="${{ vars.VITE_LOGOUT_KEYCLOAK_CLIENT_ID }}"
            -p VITE_COGNITO_SCOPES="${{ vars.VITE_COGNITO_SCOPES }}"
            -p VITE_ZONE="${{ vars.VITE_ZONE }}"
            -p VITE_LEXIS_PROD_RTM_ONLY="$LEXIS_PROD_RTM_ONLY"
            -p VITE_LEXIS_REPORT_ENDPOINT_BASE="${{ vars.VITE_LEXIS_REPORT_ENDPOINT_BASE }}"
            -p VITE_LEXIS_REPORT_API_BASE="${{ vars.VITE_LEXIS_REPORT_API_BASE }}"
          triggers: ${{ inputs.triggers }}

      - name: Default Route (non-PROD)
        if: ${{ inputs.target != 'prod' }}
        uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        with:
          file: frontend/openshift.route.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p SLOT="${{ inputs.slot || inputs.target }}"
          triggers: ${{ inputs.triggers }}

      - name: Vanity Route (PROD)
        if: ${{ inputs.target == 'prod' }}
        uses: bcgov/action-deployer-openshift@f7bd61ec357fb1dfd1d43f1287bcd21382d06348 # v4.1.0
        env:
          VANITY_TLS_CERTIFICATE: ${{ secrets.vanity_tls_certificate }}
          VANITY_TLS_KEY: ${{ secrets.vanity_tls_key }}
          VANITY_TLS_CA_CERTIFICATE: ${{ secrets.vanity_tls_ca_certificate }}
        with:
          file: frontend/openshift.vanity-route.yml
          oc_namespace: ${{ secrets.oc_namespace }}
          oc_server: ${{ vars.oc_server }}
          oc_token: ${{ secrets.oc_token }}
          debug: false
          overwrite: true
          parameters:
            -p NAME="${{ github.event.repository.name }}"
            -p ZONE="${{ inputs.target }}"
            -p VANITY_HOST="$VANITY_HOST"
            -p VANITY_TLS_CERTIFICATE="$VANITY_TLS_CERTIFICATE"
            -p VANITY_TLS_KEY="$VANITY_TLS_KEY"
            -p VANITY_TLS_CA_CERTIFICATE="$VANITY_TLS_CA_CERTIFICATE"

  deployment-result:
    name: Record deployment result
    needs: [backend, frontend]
    if: ${{ always() }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail incomplete deployments
        if: ${{ needs.backend.result != 'success' || needs.frontend.result != 'success' }}
        run: |
          echo "Backend deployment result: ${{ needs.backend.result }}"
          echo "Frontend deployment result: ${{ needs.frontend.result }}"
          exit 1

      - name: Confirm deployment
        run: echo "Backend and frontend deployments succeeded."
