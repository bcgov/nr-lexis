name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/graphics/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    runs-on: ubuntu-24.04
    steps:
      - id: pr
        uses: bcgov/action-get-pr@3931962bf13b3f4702d0013ec7c836f752ff1a3b # v0.3.0

  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}
      backend_replicas: "2"
      frontend_replicas: "2"

  tests:
    name: Tests
    needs: [deploy-test]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  bceid-regression:
    name: TEST BCeID Regression (${{ matrix.project }})
    needs: [deploy-test]
    environment: test
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    env:
      E2E_BASE_URL: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.project }}

      - name: Wait for deployed frontend
        run: bash ../.github/scripts/wait-for-frontend.sh "$E2E_BASE_URL"

      - name: Check Business BCeID credentials
        env:
          E2E_BCEID_USER: ${{ secrets.E2E_BCEID_USER }}
          E2E_BCEID_PASSWORD: ${{ secrets.E2E_BCEID_PASSWORD }}
        run: |
          echo "::add-mask::$E2E_BCEID_USER"
          echo "::add-mask::$E2E_BCEID_PASSWORD"
          test -n "$E2E_BCEID_USER" || (echo "E2E_BCEID_USER is required for TEST BCeID regression." && exit 1)
          test -n "$E2E_BCEID_PASSWORD" || (echo "E2E_BCEID_PASSWORD is required for TEST BCeID regression." && exit 1)

      - name: Run TEST Business BCeID provincial submitter suite
        env:
          E2E_BCEID_USER: ${{ secrets.E2E_BCEID_USER }}
          E2E_BCEID_PASSWORD: ${{ secrets.E2E_BCEID_PASSWORD }}
          E2E_PROVINCIAL_APPLICATION_NUMBER: ${{ vars.E2E_PROVINCIAL_APPLICATION_NUMBER }}
          E2E_PROVINCIAL_UNOWNED_APPLICATION_NUMBER: ${{ vars.E2E_PROVINCIAL_UNOWNED_APPLICATION_NUMBER }}
          CI: "true"
        run: |
          npm run e2e:real-bceid -- --reporter=html,list

      - uses: actions/upload-artifact@v7
        if: (! cancelled())
        with:
          name: playwright-real-bceid-${{ matrix.project }}-test
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    # TODO(infra): Re-enable PROD deployment once prod environment approvals,
    # secrets, and readiness checks are finalized.
    if: false
    name: PROD Deploys (${{ needs.init.outputs.pr }})
    needs: [tests, bceid-regression, init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
    with:
      environment: prod
      target: prod
      tag: ${{ needs.init.outputs.pr }}
      backend_replicas: "3"
      frontend_replicas: "3"

  promote:
    # TODO(infra): Re-enable image promotion when deploy-prod is re-enabled.
    if: false
    name: Promote Images
    needs: [deploy-prod, init]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ needs.init.outputs.pr }}
          tags: prod
