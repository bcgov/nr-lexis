name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/graphics/**"
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  builds:
    name: Build Main Images
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 10
    steps:
      - name: Check out the exact merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify build source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "${actual_sha}" != "${GITHUB_SHA}" ]; then
            echo "::error title=Incorrect build source::Expected ${GITHUB_SHA}, found ${actual_sha}."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.package }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.package }} image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./${{ matrix.package }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.package }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.package }}:buildcache,mode=max
          build-args: BUILDKIT_INLINE_CACHE=1
          sbom: true
          provenance: mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.package }}
          subject-digest: ${{ steps.build.outputs.digest }}

  deploy-test:
    name: TEST Deploys (${{ github.sha }})
    needs: [builds]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      clamav_namespace: ${{ secrets.clamav_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
      lexis_prod_rtm_only: ${{ secrets.lexis_prod_rtm_only }}
      keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
      keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
      lexis_mail_override_recipients: ${{ secrets.LEXIS_MAIL_OVERRIDE_RECIPIENTS }}
      lexis_mail_from: ${{ secrets.LEXIS_MAIL_FROM }}
      lexis_mail_region_rco_address: ${{ secrets.LEXIS_MAIL_REGION_RCO_ADDRESS }}
      lexis_mail_region_rni_address: ${{ secrets.LEXIS_MAIL_REGION_RNI_ADDRESS }}
      lexis_mail_region_rsi_address: ${{ secrets.LEXIS_MAIL_REGION_RSI_ADDRESS }}
    with:
      environment: test
      target: test
      tag: ${{ github.sha }}
      backend_min_replicas: "2"
      backend_max_replicas: "6"
      frontend_replicas: "2"
      backend_cpu_request: "750m"
      backend_memory_request: "1536Mi"
      backend_cpu_limit: "2"
      backend_memory_limit: "3Gi"
      frontend_cpu_request: "100m"
      frontend_memory_request: "128Mi"
      frontend_cpu_limit: "500m"
      frontend_memory_limit: "256Mi"
      expiry_enabled: true

  tests:
    name: Tests
    needs: [deploy-test]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  deploy-prod:
    name: PROD Deploys (${{ github.sha }})
    needs: [tests]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      clamav_namespace: ${{ secrets.clamav_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
      lexis_prod_rtm_only: ${{ secrets.lexis_prod_rtm_only }}
      keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
      keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
      lexis_mail_from: ${{ secrets.LEXIS_MAIL_FROM }}
      lexis_mail_region_rco_address: ${{ secrets.LEXIS_MAIL_REGION_RCO_ADDRESS }}
      lexis_mail_region_rni_address: ${{ secrets.LEXIS_MAIL_REGION_RNI_ADDRESS }}
      lexis_mail_region_rsi_address: ${{ secrets.LEXIS_MAIL_REGION_RSI_ADDRESS }}
      vanity_tls_certificate: ${{ secrets.VANITY_TLS_CERTIFICATE }}
      vanity_tls_key: ${{ secrets.VANITY_TLS_KEY }}
      vanity_tls_ca_certificate: ${{ secrets.VANITY_TLS_CA_CERTIFICATE }}
    with:
      environment: prod
      target: prod
      tag: ${{ github.sha }}
      backend_min_replicas: "3"
      backend_max_replicas: "10"
      frontend_replicas: "3"
      backend_cpu_request: "400m"
      backend_memory_request: "1Gi"
      backend_cpu_limit: "1500m"
      backend_memory_limit: "1536Mi"
      expiry_enabled: true

  # Sync Sysdig email alerts for PROD. No-ops cleanly if SYSDIG_API_TOKEN is
  # unset; alert templates live in monitoring/alerts/.
  monitor-prod:
    name: Sysdig Monitor (PROD)
    needs: [deploy-prod]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: bcgov/actions/sysdig-monitor@4ad61a784f1c17765b03d8d6de9737c1d3f4c0f2 # v0.5.0
        with:
          sysdig_api_token: ${{ secrets.SYSDIG_API_TOKEN }}
          oc_namespace: ${{ secrets.oc_namespace }}
          app: nr-lexis

  promote:
    name: Promote Images
    needs: [deploy-prod]
    runs-on: ubuntu-slim
    permissions:
      packages: write
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ github.sha }}
          tags: prod
