name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/graphics/**"
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Intentional quickstart-openshift build-once/promote model. This workflow deploys
  # PR-numbered images, not images built from the merged main SHA. Before sequential
  # merges, synchronize each later PR with main and confirm its images were refreshed
  # from that current baseline. See docs/architecture.md#image-promotion-model.
  init:
    name: Initialize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      capture_attempt: ${{ steps.images.outputs.capture_attempt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pr
        uses: bcgov/action-get-pr@3931962bf13b3f4702d0013ec7c836f752ff1a3b # v0.3.0

      - name: Resolve candidate image digests
        id: images
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr }}
        run: node .github/scripts/release-images.mjs capture

  deploy-test:
    name: TEST Deploys (${{ needs.init.outputs.pr }})
    needs: [init]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      clamav_namespace: ${{ secrets.clamav_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
      keycloak_sa_client_id: ${{ secrets.keycloak_sa_client_id }}
      keycloak_sa_client_secret: ${{ secrets.keycloak_sa_client_secret }}
      lexis_mail_override_recipients: ${{ secrets.LEXIS_MAIL_OVERRIDE_RECIPIENTS }}
      lexis_mail_from: ${{ secrets.LEXIS_MAIL_FROM }}
      lexis_mail_region_rco_address: ${{ secrets.LEXIS_MAIL_REGION_RCO_ADDRESS }}
      lexis_mail_region_rni_address: ${{ secrets.LEXIS_MAIL_REGION_RNI_ADDRESS }}
      lexis_mail_region_rsi_address: ${{ secrets.LEXIS_MAIL_REGION_RSI_ADDRESS }}
    with:
      environment: test
      target: test
      tag: ${{ needs.init.outputs.pr }}
      backend_image: ${{ needs.init.outputs.backend_image }}
      frontend_image: ${{ needs.init.outputs.frontend_image }}
      # Keep TEST at 2 replicas until quota can accommodate a third backend pod.
      backend_min_replicas: "2"
      backend_max_replicas: "2"
      frontend_replicas: "2"
      backend_cpu_request: "750m"
      backend_memory_request: "1536Mi"
      backend_cpu_limit: "2"
      backend_memory_limit: "3Gi"
      frontend_cpu_request: "100m"
      frontend_memory_request: "128Mi"
      frontend_cpu_limit: "500m"
      frontend_memory_limit: "256Mi"
      expiry_enabled: true

  tests:
    name: Tests
    needs: [deploy-test]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: test

  release-candidate:
    name: Record tested release candidate
    needs: [init, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record tested images
        env:
          CAPTURE_ATTEMPT: ${{ needs.init.outputs.capture_attempt }}
          BACKEND_IMAGE: ${{ needs.init.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.init.outputs.frontend_image }}
        run: node .github/scripts/release-images.mjs record "$RUNNER_TEMP/release-candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate.json
          if-no-files-found: error
