name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-24.04
    outputs:
      slot: ${{ steps.calc.outputs.slot }}
    steps:
      - id: calc
        run: |
          slot=$(( ${{ github.event.number }} % 50 ))
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"
          echo "PR ${{ github.event.number }} -> Cognito slot ${slot}"

  builds:
    name: Builds
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@de3d575cf158e16f5dc2789630f6d587483b911c # v4.4.0
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/')

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Maven verify
        working-directory: backend
        run: mvn -B -DskipITs verify

  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend quality checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run format:check

  frontend-test-shards:
    name: Frontend Test Shard (${{ matrix.index }}/${{ matrix.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            total: 3
          - index: 2
            total: 3
          - index: 3
            total: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend coverage shard
        working-directory: frontend
        env:
          LEXIS_VITEST_SHARD: "true"
        run: npm run test:cov -- --reporter=blob --shard=${{ matrix.index }}/${{ matrix.total }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-blob-${{ matrix.index }}
          path: frontend/.vitest-reports/*.json
          retention-days: 1
          if-no-files-found: error

  frontend-tests:
    name: Frontend Tests
    needs: [frontend-test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download Vitest shard reports
        uses: actions/download-artifact@v5
        with:
          pattern: vitest-blob-*
          path: frontend/.vitest-reports
          merge-multiple: true

      - name: Merge coverage and enforce thresholds
        working-directory: frontend
        run: npx vitest --merge-reports=.vitest-reports --coverage

  deploys:
    name: Deploys (${{ github.event.number }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [builds, vars, backend-tests, frontend-quality, frontend-tests]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      clamav_namespace: ${{ secrets.clamav_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
      lexis_prod_rtm_only: ${{ secrets.lexis_prod_rtm_only }}
      lexis_mail_override_recipients: ${{ secrets.LEXIS_MAIL_OVERRIDE_RECIPIENTS }}
      lexis_mail_from: ${{ secrets.LEXIS_MAIL_FROM }}
      lexis_mail_region_rco_address: ${{ secrets.LEXIS_MAIL_REGION_RCO_ADDRESS }}
      lexis_mail_region_rni_address: ${{ secrets.LEXIS_MAIL_REGION_RNI_ADDRESS }}
      lexis_mail_region_rsi_address: ${{ secrets.LEXIS_MAIL_REGION_RSI_ADDRESS }}
    with:
      environment: dev
      target: ${{ github.event.number }}
      slot: ${{ needs.vars.outputs.slot }}
      backend_min_replicas: "1"
      backend_max_replicas: "1"
      frontend_replicas: "1"
      triggers: ('backend/', 'frontend/', '.github/workflows/')

  tests:
    name: Tests
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.deploys.outputs.triggered == 'true'
    needs: [deploys, vars]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: ${{ github.event.number }}
      slot: ${{ needs.vars.outputs.slot }}

  results:
    name: PR Results
    needs:
      [
        builds,
        backend-tests,
        frontend-quality,
        frontend-test-shards,
        frontend-tests,
        deploys,
        tests,
      ]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'cancelled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
