name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  vars:
    name: Variables
    runs-on: ubuntu-24.04
    outputs:
      slot: ${{ steps.calc.outputs.slot }}
    steps:
      - id: calc
        run: |
          slot=$(( ${{ github.event.number }} % 50 ))
          echo "slot=${slot}" >> "$GITHUB_OUTPUT"
          echo "PR ${{ github.event.number }} -> Cognito slot ${slot}"

  builds:
    name: Builds
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      attestations: write
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [backend, frontend, clamav]
    timeout-minutes: 10
    steps:
      - uses: bcgov/action-builder-ghcr@de3d575cf158e16f5dc2789630f6d587483b911c # v4.4.0
        with:
          package: ${{ matrix.package }}
          tags: ${{ github.event.number }}
          tag_fallback: latest
          triggers: ('${{ matrix.package }}/', '.github/workflows/')

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 21 (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Maven verify
        working-directory: backend
        run: mvn -B -DskipITs verify

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:cov

  clamav-daemon-detection:
    name: ClamAV Daemon Detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build and verify ClamAV daemon and malware detection
        run: bash .github/scripts/check-clamav-daemon-detection.sh

  deploys:
    name: Deploys (${{ github.event.number }})
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [builds, vars, backend-tests, frontend-tests, clamav-daemon-detection]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-deploy.yml
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
      database_user: ${{ secrets.database_user }}
      database_password: ${{ secrets.database_password }}
      database_host: ${{ secrets.database_host }}
      database_service_name: ${{ secrets.database_service_name }}
      keystore_secret: ${{ secrets.keystore_secret }}
      redis_password: ${{ secrets.redis_password }}
      lexis_prod_rtm_only: ${{ secrets.lexis_prod_rtm_only }}
    with:
      environment: dev
      target: ${{ github.event.number }}
      slot: ${{ needs.vars.outputs.slot }}
      triggers: ('backend/', 'frontend/', 'clamav/', '.github/workflows/')

  tests:
    name: Tests
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.deploys.outputs.triggered == 'true'
    needs: [deploys, vars]
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-tests.yml
    with:
      target: ${{ github.event.number }}
      slot: ${{ needs.vars.outputs.slot }}

  results:
    name: PR Results
    needs: [builds, backend-tests, frontend-tests, clamav-daemon-detection, deploys, tests]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure')||contains(needs.*.result, 'cancelled')
        run: echo "At least one job has failed." && exit 1
      - run: echo "Success!"
