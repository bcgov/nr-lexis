name: AI PR Review

# Usage: /ai-review [light|standard|deep|security] [anthropic|openai|both]
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # 22899244 = alexmcdermid
    if: >-
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/ai-review')
      && github.event.comment.user.id == 22899244
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: alexmcdermid/ai-review@80f7f5c0dec36e30b8749dbaa27b41a6d78c880b # main
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_REVIEWER_API_KEY }}
          openai-api-key: ${{ secrets.OPENAI_API_REVIEWER_KEY }}
