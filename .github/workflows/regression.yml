name: Regression

on:
  schedule:
    - cron: "0 10 * * 3" # Wednesdays at 10:00 UTC; 3 AM Pacific during daylight time.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  credentialed-regression:
    name: TEST IDIR Regression (${{ matrix.project }})
    environment: test
    defaults:
      run:
        working-directory: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    env:
      E2E_BASE_URL: https://${{ github.event.repository.name }}-test.apps.silver.devops.gov.bc.ca
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check regression secrets
        env:
          E2E_IDIR_USER: ${{ secrets.E2E_IDIR_USER }}
          E2E_IDIR_PASSWORD: ${{ secrets.E2E_IDIR_PASSWORD }}
        run: |
          test -n "$E2E_IDIR_USER" || (echo "E2E_IDIR_USER test environment secret is required." && exit 1)
          test -n "$E2E_IDIR_PASSWORD" || (echo "E2E_IDIR_PASSWORD test environment secret is required." && exit 1)

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.project }}

      - name: Wait for deployed frontend
        run: bash ../.github/scripts/wait-for-frontend.sh "$E2E_BASE_URL"

      - name: Run TEST IDIR regression suite
        env:
          CI: "true"
          E2E_IDIR_USER: ${{ secrets.E2E_IDIR_USER }}
          E2E_IDIR_PASSWORD: ${{ secrets.E2E_IDIR_PASSWORD }}
        run: |
          npm run e2e:regression:idir -- --reporter=html,list

      - uses: actions/upload-artifact@v7
        if: (! cancelled())
        with:
          name: playwright-regression-${{ matrix.project }}-test
          path: frontend/playwright-report
          retention-days: 7
