name: Regression

on:
  schedule:
    - cron: "0 10 * * 3" # Wednesdays at 10:00 UTC; 3 AM Pacific during daylight time.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  credentialed-regression:
    name: TEST Regression (${{ matrix.project }})
    if: github.ref_name == github.event.repository.default_branch
    concurrency:
      group: ${{ format('{0}-test-browser', github.event.repository.name) }}
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    environment:
      name: test
      deployment: false
    defaults:
      run:
        shell: bash
        working-directory: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    outputs:
      regression-outcome: ${{ steps.run-regression.outcome }}
    env:
      E2E_BASE_URL: https://${{ github.event.repository.name }}-test.apps.gold.devops.gov.bc.ca
      E2E_REGRESSION_CLIENT_NUMBER: ${{ vars.E2E_REGRESSION_CLIENT_NUMBER }}
      E2E_REGRESSION_CLIENT_LOCATION_CODE: ${{ vars.E2E_REGRESSION_CLIENT_LOCATION_CODE }}
      E2E_REGRESSION_LEGACY_REGION_CODE: ${{ vars.E2E_REGRESSION_LEGACY_REGION_CODE }}
      E2E_REGRESSION_TIMBER_MARK: ${{ vars.E2E_REGRESSION_TIMBER_MARK }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate and mask regression secrets
        env:
          E2E_IDIR_USER: ${{ secrets.E2E_IDIR_USER }}
          E2E_IDIR_PASSWORD: ${{ secrets.E2E_IDIR_PASSWORD }}
        run: |
          test -n "$E2E_IDIR_USER" || (echo "E2E_IDIR_USER test environment secret is required." && exit 1)
          test -n "$E2E_IDIR_PASSWORD" || (echo "E2E_IDIR_PASSWORD test environment secret is required." && exit 1)
          echo "::add-mask::$E2E_IDIR_USER"
          echo "::add-mask::$E2E_IDIR_PASSWORD"

      - name: Install dependencies
        run: npm ci

      - name: Wait for deployed frontend
        run: bash ../.github/scripts/wait-for-frontend.sh "$E2E_BASE_URL"

      - name: Run TEST regression suite
        id: run-regression
        continue-on-error: true
        env:
          CI: "true"
          E2E_IDIR_USER: ${{ secrets.E2E_IDIR_USER }}
          E2E_IDIR_PASSWORD: ${{ secrets.E2E_IDIR_PASSWORD }}
        run: |
          npx playwright test \
            --config=playwright.regression.config.ts \
            --project=${{ matrix.project }} \
            --reporter=line

  regression-result:
    name: TEST Regression Result
    needs: [credentialed-regression]
    if: ${{ always() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check TEST regression result
        run: |
          if [ "${{ needs.credentialed-regression.result }}" != "success" ]; then
            echo "TEST regression setup failed before the regression result could be collected."
            exit 1
          fi
          if [ "${{ needs.credentialed-regression.outputs.regression-outcome }}" != "success" ]; then
            echo "TEST regression failed. Check the redacted TEST Regression job logs."
            exit 1
          fi
