name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one to mutate a
  # preview environment at a time.
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Image Promotion
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@ca6579bdadf383a2513397081f963889b92823a4 # v1.1.0
    permissions:
      packages: write
    secrets:
      oc_namespace: ${{ secrets.oc_namespace }}
      oc_token: ${{ secrets.oc_token }}
    with:
      cleanup: label
      packages: backend frontend
      # The helper's default cleanup label is `app=<repo-name>-<target>`
      # (i.e. `app=nr-lexis-<PR#>`), but every object in our templates is
      # labelled `app=nr-lexis-{backend,frontend}-<PR#>`. Those labels are
      # also the selectors for each component, so they cannot be flattened
      # into one PR-wide value without mixing backend and frontend pods.
      # `cleanup_name` is the helper's escape hatch: a space-separated list
      # of label values it iterates over.
      cleanup_name: nr-lexis-backend-${{ github.event.number }} nr-lexis-frontend-${{ github.event.number }}
