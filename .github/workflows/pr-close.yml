name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one to mutate a
  # preview environment at a time.
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Image Promotion
    uses: bcgov/quickstart-openshift-helpers/.github/workflows/.pr-close.yml@ca6579bdadf383a2513397081f963889b92823a4 # v1.1.0
    permissions:
      packages: write
    with:
      packages: backend frontend

  cleanup-networkpolicies:
    name: Cleanup PR OpenShift Resources
    needs: cleanup
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    environment: dev
    permissions:
      pull-requests: read
    steps:
      - id: open-prs
        name: List Open PRs
        uses: actions/github-script@v8
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            core.setOutput('numbers', prs.map((pr) => pr.number).join(' '))

      - name: Install OpenShift CLI
        run: |
          set -euo pipefail
          if command -v oc >/dev/null 2>&1; then
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/oc"
          curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.14/openshift-client-linux.tar.gz" -o "${RUNNER_TEMP}/oc.tar.gz"
          tar -xzf "${RUNNER_TEMP}/oc.tar.gz" -C "${RUNNER_TEMP}/oc" oc
          echo "${RUNNER_TEMP}/oc" >> "${GITHUB_PATH}"

      - name: Login to OpenShift
        env:
          NAMESPACE: ${{ secrets.oc_namespace }}
          OC_SERVER: ${{ vars.oc_server }}
          OC_TOKEN: ${{ secrets.oc_cleanup_token }}
        run: |
          set -euo pipefail
          oc login --server="${OC_SERVER}" --token="${OC_TOKEN}" >/dev/null
          oc project "${NAMESPACE}" >/dev/null

      - name: Delete per-PR OpenShift resources
        env:
          CLOSED_PR: ${{ github.event.number }}
          NAMESPACE: ${{ secrets.oc_namespace }}
          OPEN_PRS: ${{ steps.open-prs.outputs.numbers }}
          REPO: ${{ github.event.repository.name }}
          RESOURCE_TYPES: deploy,rs,pod,svc,route,hpa,networkpolicy,secret,pvc,cm
        run: |
          set -euo pipefail

          oc project "${NAMESPACE}" >/dev/null

          is_open_pr() {
            local pr_number="$1"
            for open_pr in ${OPEN_PRS}; do
              if [ "${open_pr}" = "${pr_number}" ]; then
                return 0
              fi
            done
            return 1
          }

          delete_preview() {
            local pr_number="$1"

            for component in backend frontend; do
              local label="${REPO}-${component}-${pr_number}"
              echo "Deleting PR resources matching app=${label}"
              oc delete "${RESOURCE_TYPES}" -n "${NAMESPACE}" -l "app=${label}" --ignore-not-found
            done
          }

          echo "Deleting resources for closed PR ${CLOSED_PR}"
          delete_preview "${CLOSED_PR}"

          PREVIEW_PRS=$(
            oc get deploy -n "${NAMESPACE}" --no-headers -o custom-columns=:metadata.name \
              | sed -nE "s/^${REPO}-(backend|frontend)-([0-9]+)$/\2/p" \
              | sort -un
          )

          if [ -z "${PREVIEW_PRS}" ]; then
            echo "No numeric PR preview deployments found for ${REPO}."
            exit 0
          fi

          for pr_number in ${PREVIEW_PRS}; do
            if is_open_pr "${pr_number}"; then
              echo "Skipping open PR preview ${pr_number}"
              continue
            fi

            echo "Deleting orphaned closed PR preview ${pr_number}"
            delete_preview "${pr_number}"
          done
